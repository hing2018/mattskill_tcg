<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matt Pocock 工程套件 — TCG 卡冊</title>
<style>
  :root{
    --bg:#0b0f18;
    --ink:#e8ecf5;
    --dim:#8b97ad;
    --line:rgba(255,255,255,.12);
    --card:#151c2b;
    --card2:#0f1521;
    --gold:#d9b45b;
    --t-daohang:#c084fc;
    --t-kaowen:#f87171;
    --t-guihua:#60a5fa;
    --t-shizuo:#34d399;
    --t-shencha:#fbbf24;
    --t-jiagou:#22d3ee;
    --t-jipan:#94a3b8;
    --t-xiezuo:#f472b6;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(1200px 600px at 10% -10%, rgba(96,165,250,.14), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(192,132,252,.12), transparent 60%),
      var(--bg);
    color:var(--ink);
    font-family:"Noto Sans TC","PingFang TC","Helvetica Neue",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding:40px 24px 80px;
  }
  header.top{max-width:1400px;margin:0 auto 28px}
  .eyebrow{font:600 12px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.22em;color:var(--gold);text-transform:uppercase}
  h1{margin:10px 0 6px;font-size:clamp(26px,3.4vw,40px);letter-spacing:-.02em}
  .sub{color:var(--dim);font-size:14px;line-height:1.7;max-width:70ch}
  .toolbar{
    max-width:1400px;margin:22px auto 26px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;
    padding:12px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.03);
    position:sticky;top:12px;z-index:20;backdrop-filter:blur(10px);
  }
  .chip{
    font-size:12.5px;padding:7px 13px;border-radius:999px;cursor:pointer;
    border:1px solid var(--line);background:transparent;color:var(--dim);
    transition:.18s;
  }
  .chip:hover{color:var(--ink);border-color:rgba(255,255,255,.3)}
  .chip.on{color:#0b0f18;background:var(--ink);border-color:var(--ink);font-weight:700}
  .chip .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;vertical-align:1px}
  .spacer{flex:1}
  .count{font:600 12px ui-monospace,monospace;color:var(--dim);letter-spacing:.08em}

  .grid{
    max-width:1400px;margin:0 auto;
    display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
    gap:22px;
  }

  /* ---------- card ---------- */
  .card{
    position:relative;
    aspect-ratio:5/7;
    border-radius:18px;
    padding:10px;
    background:
      linear-gradient(160deg, rgba(255,255,255,.10), rgba(255,255,255,0) 40%),
      var(--card);
    border:1px solid rgba(255,255,255,.14);
    box-shadow:0 18px 40px -18px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.10);
    overflow:hidden;
    display:flex;flex-direction:column;
    transition:transform .22s ease, box-shadow .22s ease, border-color .22s;
    --c:var(--t-jipan);
  }
  .card::before{ /* type aura */
    content:"";position:absolute;inset:-40% -20% auto -20%;height:70%;
    background:radial-gradient(50% 60% at 50% 50%, color-mix(in srgb, var(--c) 40%, transparent), transparent 70%);
    opacity:.55;pointer-events:none;
  }
  .card:hover{transform:translateY(-6px);border-color:color-mix(in srgb, var(--c) 55%, #fff 10%);
    box-shadow:0 26px 60px -22px rgba(0,0,0,.95), 0 0 0 1px color-mix(in srgb, var(--c) 35%, transparent), inset 0 1px 0 rgba(255,255,255,.14);}

  .card-inner{
    position:relative;z-index:1;flex:1;display:flex;flex-direction:column;
    border-radius:12px;
    background:linear-gradient(180deg, rgba(8,12,20,.55), rgba(8,12,20,.86));
    border:1px solid rgba(255,255,255,.07);
    overflow:hidden;
  }

  .card-head{padding:14px 15px 12px;border-bottom:1px solid rgba(255,255,255,.08);
    background:linear-gradient(180deg, color-mix(in srgb, var(--c) 20%, transparent), transparent);}
  .head-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px}
  .no{font:700 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.16em;color:var(--c);opacity:.95}
  .badges{display:flex;gap:6px;align-items:center}
  .badge{font-size:9.5px;font-weight:700;letter-spacing:.08em;padding:3px 7px;border-radius:5px;white-space:nowrap}
  .badge.auto{background:var(--gold);color:#1a1300}
  .badge.manual{border:1px solid rgba(255,255,255,.35);color:#cfd8e6}

  .name{
    margin:0;font-size:clamp(23px,2.05vw,31px);line-height:1.05;font-weight:900;letter-spacing:-.025em;
    word-break:break-word;
    text-shadow:0 2px 18px color-mix(in srgb, var(--c) 40%, transparent);
  }
  .type{display:flex;align-items:center;gap:7px;margin-top:10px;font-size:11.5px;letter-spacing:.14em;color:var(--c);font-weight:700}
  .type .bar{flex:1;height:1px;background:linear-gradient(90deg, color-mix(in srgb, var(--c) 60%, transparent), transparent)}

  /* ---------- per-type bottom watermark ---------- */
  .card-inner > *{position:relative;z-index:1}
  .card-inner::after{
    content:"";position:absolute;left:0;right:0;bottom:0;height:40%;z-index:0;
    pointer-events:none;opacity:.17;
    background-image:var(--pat);background-size:var(--pat-size,auto);
    -webkit-mask-image:linear-gradient(to top,#000 0%,#000 24%,transparent 94%);
    mask-image:linear-gradient(to top,#000 0%,#000 24%,transparent 94%);
    transition:opacity .22s ease;
  }
  .card:hover .card-inner::after{opacity:.32}

  .card-body{padding:13px 15px;display:flex;flex-direction:column;gap:11px;flex:1}
  .field .k{font:700 9.5px/1 ui-monospace,monospace;letter-spacing:.16em;color:var(--dim);margin-bottom:5px}
  .field .v{font-size:12.8px;line-height:1.62;color:#dfe6f2}
  .chain{margin-top:auto;padding-top:11px;border-top:1px dashed rgba(255,255,255,.13)}
  .chain .v{
    display:inline-block;padding:6px 10px 6px 8px;border-radius:9px;line-height:1.4;
    font-size:12.4px;
    color:color-mix(in srgb, var(--c) 28%, #fff);font-weight:800;
    background:color-mix(in srgb, var(--c) 20%, rgba(255,255,255,.05));
    border:1px solid color-mix(in srgb, var(--c) 42%, transparent);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.08);
    transition:background .2s ease, border-color .2s ease, color .2s ease;
  }
  .card:hover .chain .v{
    color:#fff;
    background:color-mix(in srgb, var(--c) 34%, rgba(255,255,255,.07));
    border-color:color-mix(in srgb, var(--c) 68%, transparent);
  }
  .chain .v .arw{opacity:.75;margin-right:7px;font-weight:400}

  .card-foot{display:flex;align-items:center;justify-content:space-between;padding:8px 15px 10px;font:600 8.6px/1 ui-monospace,monospace;letter-spacing:.14em;color:rgba(255,255,255,.32)}
  .gem{width:10px;height:10px;border-radius:3px;transform:rotate(45deg);background:var(--c);box-shadow:0 0 10px color-mix(in srgb, var(--c) 70%, transparent)}

  /* type colors + bottom watermark pattern
     每類一種紋理，只用 CSS 漸層，顏色跟著 --c 走 */
  .t-daohang{--c:var(--t-daohang);
    --pat:
      repeating-linear-gradient(60deg, var(--c) 0 1.7px, transparent 1.7px 15px),
      repeating-linear-gradient(-60deg, var(--c) 0 1.7px, transparent 1.7px 15px);}

  .t-kaowen{--c:var(--t-kaowen);
    --pat:repeating-radial-gradient(circle at 50% 50%, var(--c) 0 1.5px, transparent 1.5px 9px);
    --pat-size:30px 30px;}

  .t-guihua{--c:var(--t-guihua);
    --pat:
      repeating-linear-gradient(0deg, var(--c) 0 1px, transparent 1px 10px),
      repeating-linear-gradient(90deg, var(--c) 0 1px, transparent 1px 10px),
      repeating-linear-gradient(0deg, var(--c) 0 1.6px, transparent 1.6px 50px),
      repeating-linear-gradient(90deg, var(--c) 0 1.6px, transparent 1.6px 50px);}

  .t-shizuo{--c:var(--t-shizuo);
    --pat:repeating-linear-gradient(45deg, var(--c) 0 1.7px, transparent 1.7px 12px);}

  .t-shencha{--c:var(--t-shencha);
    --pat:repeating-linear-gradient(0deg, var(--c) 0 1px, transparent 1px 6px);}

  .t-jiagou{--c:var(--t-jiagou);
    --pat:
      repeating-linear-gradient(45deg, var(--c) 0 1.3px, transparent 1.3px 20px),
      repeating-linear-gradient(-45deg, var(--c) 0 1.3px, transparent 1.3px 20px);}

  .t-jipan{--c:var(--t-jipan);
    --pat:radial-gradient(circle at 50% 50%, var(--c) 0 1.4px, transparent 1.6px);
    --pat-size:11px 11px;}

  .t-xiezuo{--c:var(--t-xiezuo);
    --pat:repeating-linear-gradient(90deg, var(--c) 0 1.5px, transparent 1.5px 9px);}

  .hidden{display:none !important}

  /* ---------- card is a button ---------- */
  .card{cursor:pointer}
  .card:focus-visible{outline:2px solid var(--c);outline-offset:4px}
  .foot-right{display:flex;align-items:center;gap:8px}
  .more{font:700 8.6px/1 ui-monospace,monospace;letter-spacing:.1em;color:rgba(255,255,255,.3);transition:.18s}
  .card:hover .more{color:var(--c);opacity:1}

  /* ---------- detail sheet ---------- */
  .sheet{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;padding:24px}
  .sheet.open{display:flex}
  .sheet-bg{position:absolute;inset:0;background:rgba(4,7,13,.8);backdrop-filter:blur(8px)}
  .panel{
    position:relative;width:min(780px,100%);max-height:min(88vh,920px);
    display:flex;flex-direction:column;border-radius:20px;overflow:hidden;
    background:linear-gradient(180deg,#151d2c,#0b1019 55%);
    border:1px solid rgba(255,255,255,.16);
    box-shadow:0 50px 140px -40px #000, inset 0 1px 0 rgba(255,255,255,.1);
    animation:pop .2s ease;
  }
  @keyframes pop{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}
  .panel::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,var(--c),transparent 80%)}

  .panel-head{padding:20px 24px 16px;border-bottom:1px solid rgba(255,255,255,.09);
    background:linear-gradient(180deg,color-mix(in srgb,var(--c) 16%,transparent),transparent);flex:none}
  .panel-head .no{font-size:11.5px}
  .panel-head .name{font-size:clamp(24px,3vw,34px);margin-top:4px}
  .x{
    width:30px;height:30px;border-radius:50%;display:grid;place-items:center;cursor:pointer;
    border:1px solid rgba(255,255,255,.22);background:transparent;color:#cfd8e6;font-size:13px;line-height:1;
    transition:.18s;margin-left:10px;
  }
  .x:hover{background:#fff;color:#0b0f18;border-color:#fff}

  .panel-body{padding:6px 24px 20px;overflow-y:auto;overscroll-behavior:contain}
  .panel-body::-webkit-scrollbar{width:10px}
  .panel-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:10px;border:3px solid transparent;background-clip:content-box}
  .sec{padding:16px 0;border-top:1px solid rgba(255,255,255,.07)}
  .sec:first-child{border-top:0;padding-top:14px}
  .sec .lbl{font:700 10px/1 ui-monospace,monospace;letter-spacing:.18em;color:var(--c);margin-bottom:9px;display:flex;align-items:center;gap:8px}
  .sec .lbl .hint-tag{font-weight:600;letter-spacing:0;color:var(--dim);font-size:10.5px;border:1px solid var(--line);padding:2px 7px;border-radius:999px}
  .sec p{margin:0 0 9px;font-size:13.8px;line-height:1.78;color:#dbe3f0}
  .sec p:last-child{margin-bottom:0}
  .sec ul,.sec ol{margin:0 0 9px;padding-left:22px}
  .sec li{font-size:13.6px;line-height:1.74;color:#dbe3f0;margin-bottom:7px}
  .sec li:last-child{margin-bottom:0}
  .sec code{font:600 11.9px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;background:rgba(255,255,255,.1);padding:1.5px 5px;border-radius:4px;color:#fff}
  .sec strong{color:#fff;font-weight:700}

  .panel-foot{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:13px 24px;border-top:1px solid rgba(255,255,255,.09);background:rgba(0,0,0,.28);
    font-size:12.6px;color:#cfd8e6}
  .panel-foot .arw{color:var(--c);font-weight:700;margin-right:8px}
  #sheetChain{
    display:inline-block;padding:7px 12px;border-radius:999px;line-height:1.4;
    color:color-mix(in srgb, var(--c) 26%, #fff);font-weight:700;
    background:color-mix(in srgb, var(--c) 18%, rgba(255,255,255,.04));
    border:1px solid color-mix(in srgb, var(--c) 40%, transparent);
  }
  .panel-foot .kbd{font:600 10px/1 ui-monospace,monospace;color:rgba(255,255,255,.35);letter-spacing:.08em}

  /* ---------- print ---------- */
  @media print{
    body{background:#fff;color:#000;padding:0}
    .toolbar,.sub,.eyebrow,.sheet{display:none !important}
    header.top{margin:0 0 10mm}
    h1{font-size:18pt;color:#000}
    .grid{grid-template-columns:repeat(3,1fr);gap:6mm;max-width:none}
    .card{aspect-ratio:auto;height:118mm;box-shadow:none;border:1px solid #bbb;break-inside:avoid;background:#fff}
    .card-inner{background:#fff;border-color:#ddd}
    .card-head{background:#f4f6fa}
    .name{color:#000;text-shadow:none}
    .field .v{color:#111}
    .chain .v{color:#000;background:#eef2f8;border-color:#c9d2e0;box-shadow:none}
    .card-foot{color:#888}
    .card-inner::after{opacity:.24}
  }
  @page{size:A4;margin:10mm}
</style>
</head>
<body>

<header class="top">
  <div class="eyebrow">Engineering + Writing Set · 40 Cards</div>
  <h1>Matt Pocock 工程套件 — TCG 卡冊</h1>
  <p class="sub">
    每張卡＝一個 skill。編號 <b>MT-001…MT-031</b> 依流程順序排列。<b>自動</b>＝模型可依情境自行載入；<b>手動</b>＝需你打 <code>/名稱</code>。
    「連鎖」欄就是打完這張之後預設要接的下一張。<b>點任一張卡</b>可展開完整詳解：一句話／解決什麼病／運作機制／產出／使用時機／別搞混／後續接著，全部直接取自 <code>Matt-Pocock-套件詳解.md</code>。
  </p>
</header>

<div class="toolbar" id="toolbar">
  <button class="chip on" data-filter="all">全部 40</button>
  <button class="chip" data-filter="導航"><span class="dot" style="background:var(--t-daohang)"></span>導航</button>
  <button class="chip" data-filter="拷問"><span class="dot" style="background:var(--t-kaowen)"></span>拷問</button>
  <button class="chip" data-filter="規劃"><span class="dot" style="background:var(--t-guihua)"></span>規劃</button>
  <button class="chip" data-filter="實作"><span class="dot" style="background:var(--t-shizuo)"></span>實作</button>
  <button class="chip" data-filter="審查"><span class="dot" style="background:var(--t-shencha)"></span>審查</button>
  <button class="chip" data-filter="架構"><span class="dot" style="background:var(--t-jiagou)"></span>架構</button>
  <button class="chip" data-filter="基盤"><span class="dot" style="background:var(--t-jipan)"></span>基盤</button>
  <button class="chip" data-filter="寫作"><span class="dot" style="background:var(--t-xiezuo)"></span>寫作</button>
  <span class="spacer"></span>
  <button class="chip" data-mode="自動">只顯示 自動</button>
  <button class="chip" data-mode="手動">只顯示 手動</button>
  <span class="count" id="count"></span>
</div>

<main class="grid" id="grid"></main>

<div class="sheet" id="sheet" aria-hidden="true">
  <div class="sheet-bg" data-close></div>
  <article class="panel" id="sheetPanel" role="dialog" aria-modal="true" aria-labelledby="sheetName">
    <header class="panel-head">
      <div class="head-row">
        <span class="no" id="sheetNo"></span>
        <span class="badges">
          <span class="badge" id="sheetMode"></span>
          <button class="x" id="sheetClose" data-close aria-label="關閉詳解">✕</button>
        </span>
      </div>
      <h2 class="name" id="sheetName"></h2>
      <div class="type"><span id="sheetType"></span><span class="bar"></span></div>
    </header>
    <div class="panel-body" id="sheetBody"></div>
    <footer class="panel-foot">
      <span id="sheetChain"></span>
      <span class="kbd">ESC 關閉 · 點背景關閉</span>
    </footer>
  </article>
</div>

<script>
const TYPE_CLASS = {
  "導航":"t-daohang","拷問":"t-kaowen","規劃":"t-guihua",
  "實作":"t-shizuo","審查":"t-shencha","架構":"t-jiagou","基盤":"t-jipan","寫作":"t-xiezuo"
};

const CARDS = [
  {id:"MT-001", name:"ask-matt", type:"導航", mode:"手動",
   use:"依你的處境，指派該從哪個 skill 進場的路由器。",
   when:"「我卡住了，不知道下一步該用哪個 skill」",
   next:"它指派的那一張"},

  {id:"MT-002", name:"grill-me", type:"拷問", mode:"自動",
   use:"一次一題拷問決策樹，每題都附建議答案；事實自己查，決策留給你。",
   when:"想法還很粗、沒有 codebase 可以記錄",
   next:"to-spec"},

  {id:"MT-003", name:"grill-with-docs", type:"拷問", mode:"手動",
   use:"同樣的拷問，但沿途把決策寫進 CONTEXT.md、詞彙表與 ADR。",
   when:"已有 codebase，決策需要留下書面紀錄",
   next:"to-spec"},

  {id:"MT-004", name:"batch-grill-me", type:"拷問", mode:"手動",
   use:"一輪問完整個「前線問題」，你批次回答，逐輪推進。",
   when:"不想被一題一題卡住、想先看到全貌",
   next:"to-spec"},

  {id:"MT-005", name:"loop-me", type:"拷問", mode:"手動",
   use:"專問「工作流程」規格，產出 workflows/*.md 與 NOTES.md。",
   when:"要自動化的是反覆發生的流程，不是功能",
   next:"implement / wizard"},

  {id:"MT-006", name:"wayfinder", type:"規劃", mode:"手動",
   use:"把巨大工作畫成 issue tracker 上的決策票地圖，一次解一張。",
   when:"大到一個 session 裝不下、連路都還看不清",
   next:"to-spec"},

  {id:"MT-007", name:"to-spec", type:"規劃", mode:"手動",
   use:"把目前對話濃縮成 spec 並發到 tracker；先畫接縫，不訪談。",
   when:"共識已經成形，要固化成可驗收文件",
   next:"to-tickets"},

  {id:"MT-008", name:"to-tickets", type:"規劃", mode:"手動",
   use:"拆成 tracer-bullet 任務票，每張宣告 blocked-by 邊界。",
   when:"spec 有了，但範圍大到一次做不完",
   next:"implement-spec / implement"},

  {id:"MT-009", name:"to-questionnaire", type:"規劃", mode:"手動",
   use:"把你答不了的決策，變成分給別人填的問卷。",
   when:"卡在只有別人知道的知識上",
   next:"grill-me → to-spec"},

  {id:"MT-010", name:"boundary-driven", type:"規劃", mode:"手動",
   use:"5h 任務塊 → 7d 週程 → 31d 檢查點，寫進 Notion。",
   when:"有明確 deadline 的專案要排程、查體溫",
   next:"goal-loop / to-tickets"},

  {id:"MT-011", name:"implement-spec", type:"實作", mode:"手動",
   use:"把票當任務圖，對前線平行開實作 agent，最後統一審查。",
   when:"spec + 票都齊，且票之間真的有依賴",
   next:"code-review"},

  {id:"MT-012", name:"implement", type:"實作", mode:"手動",
   use:"單張票實作，在約定接縫驅動 tdd，結束前自我審查再 commit。",
   when:"一次只做一張票、想盯每一次 red-green",
   next:"code-review"},

  {id:"MT-013", name:"tdd", type:"實作", mode:"自動",
   use:"red → green 紀律：先約定接縫，再寫會紅的行為測試。",
   when:"要新增行為或修 bug，而且想要護欄",
   next:"code-review"},

  {id:"MT-014", name:"code-review", type:"審查", mode:"自動",
   use:"Standards 與 Spec 兩軸平行審查 diff，兩份報告不合併排名。",
   when:"開 PR 前，或要驗收 AI 寫的東西",
   next:"修完再 review"},

  {id:"MT-015", name:"diagnosing-bugs", type:"審查", mode:"自動",
   use:"六階段診斷；沒有「已變紅的指令」之前不准開始推理。",
   when:"硬 bug、間歇性錯誤、效能退化",
   next:"tdd / improve-codebase-architecture"},

  {id:"MT-016", name:"triage", type:"審查", mode:"手動",
   use:"把別人丟進來的 issue／PR 走狀態機分類，寫 agent brief。",
   when:"issue 堆積，要決定哪些能丟給 agent",
   next:"implement"},

  {id:"MT-017", name:"qa", type:"審查", mode:"自動",
   use:"對話式 QA：背景讀 codebase，直接把 bug 開成可重現的 issue。",
   when:"要把口頭上的問題變成可追蹤 issue",
   next:"triage"},

  {id:"MT-018", name:"request-refactor-plan", type:"審查", mode:"自動",
   use:"訪談出「每步都還能跑」的極小 commit 計畫，開成 issue。",
   when:"想重構，但怕一次改爆",
   next:"implement"},

  {id:"MT-019", name:"improve-codebase-architecture", type:"架構", mode:"手動",
   use:"掃深化機會，產 before/after 的 HTML 報告，再挑一個拷問。",
   when:"想保養 codebase、AI 在這專案常迷路",
   next:"grill-with-docs"},

  {id:"MT-020", name:"codebase-design", type:"架構", mode:"自動",
   use:"深模組共同詞彙：depth、seam、leverage、locality。",
   when:"要判斷介面夠不夠深、接縫該擺哪",
   next:"design-an-interface"},

  {id:"MT-021", name:"design-an-interface", type:"架構", mode:"自動",
   use:"Design It Twice：多 agent 用不同約束設計同一模組再比較。",
   when:"同一模組有多種 API 形狀可選",
   next:"to-spec"},

  {id:"MT-022", name:"setup-ts-deep-modules", type:"架構", mode:"手動",
   use:"用 dependency-cruiser 把「只能從入口檔 import」變成 CI 擋。",
   when:"模組邊界已經爛掉、想一次上鎖",
   next:"codebase-design"},

  {id:"MT-023", name:"domain-modeling", type:"架構", mode:"自動",
   use:"持續打磨領域語言，術語一有結論就即時更新 CONTEXT.md／ADR。",
   when:"詞彙混亂、或要記錄難以回頭的決策",
   next:"to-spec"},

  {id:"MT-024", name:"ubiquitous-language", type:"架構", mode:"手動",
   use:"抽出 DDD 詞彙表快照，標歧義、給 canonical 用語。",
   when:"想要一份「這專案每個詞是什麼意思」",
   next:"domain-modeling"},

  {id:"MT-025", name:"prototype", type:"架構", mode:"自動",
   use:"寫一段用完就丟的程式，回答一個設計問題。",
   when:"紙上吵不完、要看到或跑到才答得出來",
   next:"grill-with-docs"},

  {id:"MT-026", name:"setup-matt-pocock-skills", type:"基盤", mode:"手動",
   use:"設定 issue tracker、triage 標籤詞彙、domain 文件佈局。",
   when:"每個 repo 第一次用這整套之前",
   next:"grill-with-docs"},

  {id:"MT-027", name:"setup-pre-commit", type:"基盤", mode:"自動",
   use:"裝 Husky＋lint-staged＋Prettier＋typecheck＋test。",
   when:"新 repo 想從此擋掉爛 commit",
   next:"implement"},

  {id:"MT-028", name:"git-guardrails-claude-code", type:"基盤", mode:"自動",
   use:"Claude Code hook：執行前攔掉 push、reset --hard、clean -f 等。",
   when:"把 repo 交給 agent 之前",
   next:"日常開發"},

  {id:"MT-029", name:"resolving-merge-conflicts", type:"基盤", mode:"自動",

   when:"卡在進行中的 merge／rebase",
   next:"code-review"},

  {id:"MT-030", name:"migrate-to-shoehorn", type:"基盤", mode:"自動",
   use:"把測試裡的 as 斷言換成 shoehorn，部分資料也型別安全。",
   when:"測試被型別搞得很醜、假資料一堆",
   next:"tdd"},

  {id:"MT-031", name:"scaffold-exercises", type:"基盤", mode:"自動",
   use:"建出能過 lint 的課程練習骨架（problem／solution／explainer）。",
   when:"開新章節、把大綱變成目錄",
   next:"writing-shape / teach"},

  {id:"MT-032", name:"writing-fragments", type:"寫作", mode:"手動",
   use:"只挖片段不排結構：逼出句子、場景、例子與領頭詞，全部 append 進同一份 md。",
   when:"還沒想清楚要寫什麼，但腦中有零碎觀察",
   next:"writing-shape / writing-beats"},

  {id:"MT-033", name:"writing-shape", type:"寫作", mode:"手動",
   use:"把素材逐段長成文章：先從 2–3 個不同論點的開頭選一個，每段只問「讀者接下來需要聽什麼」。",
   when:"素材足夠，要寫成有論證的文章",
   next:"edit-article"},

  {id:"MT-034", name:"writing-beats", type:"寫作", mode:"手動",
   use:"一次只寫一個 beat，每次給 2–3 個候選下一步，像選擇你自己的冒險。",
   when:"要節奏、轉折、懸念，而不是線性論證",
   next:"edit-article"},

  {id:"MT-035", name:"edit-article", type:"寫作", mode:"手動",
   use:"切成 section、依資訊 DAG 重排，逐段重寫到每段 ≤240 字。",
   when:"草稿有了，要讓它清楚、順、不重複",
   next:"發佈 / 回 writing-shape 補段"},

  {id:"MT-036", name:"writing-great-skills", type:"寫作", mode:"手動",
   use:"寫 skill 的寫作指南：領頭詞、可檢查的完成判準、資訊階梯、六大失效模式。",
   when:"skill 每次漏步驟、description 愈寫愈長",
   next:"動手改 skill / 補 router"},

  {id:"MT-037", name:"research", type:"寫作", mode:"自動",
   use:"派背景 agent 查一手來源，每條主張連回出處，產出一份 markdown。",
   when:"需要官方文件／API 事實，但不想自己讀完",
   next:"grill-with-docs / to-spec"},

  {id:"MT-038", name:"teach", type:"寫作", mode:"手動",
   use:"用目錄當學習工作區，產出 lesson、reference、learning record，用 MISSION.md 校準。",
   when:"要跨多次 session 學會一個主題",
   next:"research → scaffold-exercises"},

  {id:"MT-039", name:"handoff", type:"導航", mode:"手動",
   use:"把對話壓成交接文件（存 OS 暫存目錄），只留指標、去重、遮蔽敏感資訊。",
   when:"context 快滿、要換 session 或分岔去 prototype",
   next:"新 session 讀那份文件"},

  {id:"MT-040", name:"wizard", type:"基盤", mode:"手動",
   use:"用 template.sh 產生互動 bash 精靈：開 URL、收值、寫 .env／GitHub secret、每步確認。",
   when:"有一次性手動流程要帶人走完（第三方設定、遷移）",
   next:"照精靈跑完 → 回主流程"}
];

const DETAILS = {"ask-matt":{"one":"<p>整套 skill 的路由器——你描述處境，它告訴你該從哪個 skill 進場。</p>","disease":"<p>skill 太多記不住，於是每次都憑印象亂挑，或在錯的階段做錯的事（例如還沒對齊就開寫）。</p>","mech":"<p>它把 skill 分成五種角色，然後依你的處境指派：</p>\n<ol><li><strong>主流程（idea → ship）</strong>：<code>grill-with-docs</code> →（需要可執行答案就插 <code>prototype</code>，用 <code>handoff</code> 當橋）→ 多 session 就 <code>to-spec</code> → <code>to-tickets</code> → 逐票 <code>implement</code>（內部驅動 <code>tdd</code>）→ <code>code-review</code>；單 session 就直接 <code>implement</code>。</li><li><strong>匝道（on-ramp）</strong>：<code>triage</code>（issue 堆積）、<code>diagnosing-bugs</code>（東西壞了）、<code>wayfinder</code>（大到看不見終點）。匝道只「產生工作」，最後都要匯回主流程。</li><li><strong>Codebase 保健</strong>：<code>improve-codebase-architecture</code>，撿到的深化機會會變成新 idea 再匯回 <code>grill-with-docs</code>。</li><li><strong>底層詞彙</strong>：<code>domain-modeling</code>（領域語言）、<code>codebase-design</code>（深模組語言）。這兩個是「字不對」時用的，不是流程。</li><li><strong>跨 session</strong>：<code>handoff</code>（分岔到新 session，保留逐字歷史）vs 內建 <code>/compact</code>（同一對話，前文被摘要）。</li></ol>\n<p>它同時規定了<strong>context 衛生</strong>：步驟 1–3 要在同一個 context window 內完成，<code>to-tickets</code> 之前不要 compact；接近「smart zone」（約 120k tokens）就 <code>handoff</code> 換執行緒。每個 <code>implement</code> 才是新 context。</p>","output":"<p>一段指派（「你現在該用 X，接著 Y」），本身不改任何檔案。</p>","when":"<p>「我現在卡住了，不知道下一步」「這情況該用哪個 skill？」「我不想讀完 30 份文件」。</p>","confuse":"<p>它不是搜尋引擎，只做路由；也不是 <code>grill-me</code>，它不問你設計問題。</p>","next":"<p>它指派的那個 skill。</p>"},"grill-me":{"one":"<p>無狀態的連續拷問，一次一題，把決策樹每一條分支問乾淨。</p>","disease":"<p>AI 拿到模糊需求就開始寫，寫完才發現方向錯了；或你以為自己想清楚了，其實有一堆隱含假設。</p>","mech":"<ol><li>沿決策樹走，<strong>一次只問一個問題</strong>，等回答再問下一題（原文：一次問多題會讓人困惑）。</li><li>每題都要附上<strong>你的建議答案</strong>（AI 先表態，你只需否決或修正）。</li><li><strong>事實 vs 決策分離</strong>：能靠探索環境（檔案、指令、工具）查到的事實，AI 自己去查；只有「決策」才交給你。</li><li>在你確認「達成共識」之前，<strong>不准動手</strong>。</li></ol>","mechHint":"原文只有 12 行，規則極硬","output":"<p>共識本身（純對話），不寫檔。</p>","when":"<p>「幫我拷問這個想法」「stress-test 一下」「我覺得哪裡怪但說不上來」；或你要設計的東西<strong>不在 repo 裡</strong>（沒有 codebase 可記錄）。</p>","confuse":"<ul><li><code>grill-with-docs</code>：同一套拷問，但會把結果寫進 <code>CONTEXT.md</code>／ADR（有 codebase 時用）。</li><li><code>batch-grill-me</code>：一次問一整輪「前線問題」，不是一次一題。</li><li><code>grilling</code>（已於 2026-11-11 移除）：原本是模型可自動叫用的同一份內容。</li></ul>","next":"<p><code>to-spec</code>（把共識固化成規格）。</p>"},"grill-with-docs":{"one":"<p>會留書面紀錄的拷問——邊問邊把決策寫進 <code>CONTEXT.md</code>、詞彙表與 <code>docs/adr/</code>。</p>","disease":"<p>同一個決策三個月後沒人記得為什麼；新人（或新 session 的 AI）要重新問一遍。</p>","mech":"<p>它的 <code>SKILL.md</code> 只有一行——「執行一次 <code>/grill-me</code> 會話，同時使用 <code>/domain-modeling</code> 技能」。也就是：</p>\n<ul><li>拷問流程本身交給 <code>grill-me</code>（一次一題、附建議答案、事實自己查）；</li><li>沿路把「術語被釐清」寫進 <code>CONTEXT.md</code>（純詞彙表，不含實作細節）；</li><li>把「難以回頭＋不看脈絡會奇怪＋真的有取捨」的決策寫成 ADR（<code>domain-modeling</code> 的三條件，缺一不寫）。</li></ul>","output":"<p>共識 ＋ <code>CONTEXT.md</code>、<code>docs/adr/NNNN-*.md</code>（檔案按需建立，不預先鋪空殼）。</p>","when":"<p><strong>已有 codebase</strong> 的功能／重構討論；團隊協作；長期專案。</p>","confuse":"<p>它「有狀態」，所以換專案就沒有累積；<code>grill-me</code> 換 session 就歸零。</p>","next":"<p><code>to-spec</code>。</p>"},"batch-grill-me":{"one":"<p>把拷問改成「一輪問完整個前線」，適合不想被一題一題卡住的人。</p>","disease":"<p><code>grill-me</code> 一問一答很慢；但你若已有一定掌握度，想一次看到全貌、批次回答。</p>","mech":"<ol><li>把設計想成一棵<strong>設計樹</strong>，每個決策會長出後續決策。</li><li>定義<strong>前線（frontier）</strong>＝所有「前置條件都已確定、現在就能問」的決策。</li><li><strong>一輪問完整個前線</strong>：每題編號＋附建議答案，然後等你回答。</li><li>你答完後重算前線（已定的決策把前線往外推），再問下一輪；「答案依賴本輪還沒答的題」一律留到下一輪。</li><li>需要事實時<strong>派 sub-agent 去查</strong>，而且<strong>不阻塞</strong>：只有依賴那個事實的題目往後排，其餘照問。</li><li>前線空了（每個分支都走過、沒有默默假設）才算完成；你確認前不動手。</li></ol>","output":"<p>共識（純對話）。</p>","when":"<p>「一次把問題問完」「我很忙，給我一批問題我一次回」。</p>","confuse":"<p><code>grill-me</code> 是深度優先（一次一題追到底），<code>batch-grill-me</code> 是廣度優先（一輪一層）。</p>","next":"<p><code>to-spec</code>；若某題特別複雜，再開 <code>grill-me</code> 深挖那一支。</p>"},"loop-me":{"one":"<p>專門拷問「你想建立的工作流程」——產出的是流程規格，不是產品規格。</p>","disease":"<p>想自動化一件事，卻連「什麼觸發、人在哪裡把關、要看到什麼才敢按過」都說不清楚，於是做出一個沒人用的流程。</p>","mech":"<ol><li>用<strong>loop 透鏡</strong>看你的生活／工作：一個 loop 是反覆出現的模式（每天、每週、每個重複動作）。越可預測，越值得委派。</li><li>執行有狀態的 <code>/grill-me</code>，唯一輸出是<strong>workflow 規格</strong>，存到 <code>workflows/*.md</code>（一個 loop 一份，這是 source of truth）。</li><li>只在流程真的需要時才引入詞彙，不強制任何結構：</li></ol>\n<ul><li><strong>Trigger</strong>：事件（新 email、新 issue）或排程（每天早上）；事件觸發通常更有效率。</li><li><strong>Checkpoint</strong>：人在迴路裡的查核點（確認或決策）；有些流程完全沒有、有些完全不用 AI。</li><li><strong>Push right</strong>：把查核點盡量往後推——先做完最大量的工作，再一次、很晚地問人。</li><li><strong>Brief</strong>：查核點只給「決策就緒的摘要」（做了什麼、為什麼、連到成品），不給原始輸出；審閱速度是硬要求。</li></ul>\n<ol start=\"4\"><li><code>NOTES.md</code> 記你的世界：用什麼工具、處理什麼通道、你怎麼稱呼它們。太薄就先訪談你的世界。</li><li><strong>完成定義</strong>：一個實作 agent 能照著規格建出來，且<strong>不用再問任何問題</strong>。</li></ol>","output":"<p><code>workflows/*.md</code>、<code>NOTES.md</code>。</p>","when":"<p>「我想設計一套每週覆盤流程」「我想要一個自動整理 issue 的流程」——重點是<strong>流程</strong>，不是功能。</p>","confuse":"<p><code>grill-me</code> 問的是「要做什麼東西」，<code>loop-me</code> 問的是「這件事多久發生一次、誰在哪裡把關」。</p>","next":"<p>規格直接交給 <code>implement</code>／<code>wizard</code>（若流程要人一步步操作），或用 <code>goal-loop</code> 跑起來。</p>"},"wayfinder":{"one":"<p>把「大到一個 session 裝不下、連路都看不清」的工作，畫成一張決策票地圖，一次解一張。</p>","disease":"<p>綠地專案或巨型功能，硬開一個 session 做 → context 爆掉、開始幻覺、決策前後矛盾。</p>","mech":"<ol><li><strong>先命名目的地</strong>（destination）：這趟要走到哪——一份 spec？一個鎖定的決策？一次資料結構遷移？目的地決定範圍，先定才畫票。</li><li>地圖是 issue tracker 上的<strong>單一 issue</strong>（label <code>wayfinder:map</code>），票是它的 child issue。</li><li>地圖 body 只有五段：<code>Destination</code>／<code>Notes</code>／<code>Decisions so far</code>（已關票的一行索引）／<code>Not yet specified</code>（戰爭迷霧）／<code>Out of scope</code>。<strong>地圖是索引，不是倉庫</strong>——決策只住在它的票裡。</li><li>每張票是一個<strong>問題</strong>，尺寸以「一個 100K token session」為單位，帶 <code>wayfinder:&lt;type&gt;</code> label：</li></ol>\n<ul><li><code>research</code>（AFK）：外部知識，派 <code>/research</code> subagent 解，成果放 <code>research/&lt;name&gt;</code> 分支並從票連過去。</li><li><code>prototype</code>（HITL）：用粗糙成品把討論具體化。</li><li><code>grilling</code>（HITL，預設）：用 <code>/grill-me</code> ＋ <code>/domain-modeling</code> 一次一題解。</li><li><code>task</code>（HITL/AFK）：<strong>唯一「做事」的票</strong>——為了讓某個決策能被做而必須先完成的手動工作（申請帳號、搬資料），靠「解鎖決策」取得存在正當性。</li></ul>\n<ol start=\"5\"><li><strong>認領</strong>：把票 assign 給自己＝認領，先 assign 再動工，其他並行 session 就會跳過。</li><li><strong>阻擋關係用 tracker 原生依賴</strong>（讓前線在 UI 上看得見）；前線＝開啟中＋未被阻擋＋未被認領的 child。</li><li><strong>戰爭迷霧</strong>：還說不清楚的問題放 <code>Not yet specified</code>；判準是「<strong>現在能不能把問題講精確</strong>」，不是「現在能不能答」。能講精確就開票（即使被阻擋）。</li><li><strong>Out of scope</strong> 與迷霧不同：那是「超過目的地」的工作，永遠不會畢業；發現某票其實超出範圍就<strong>關掉它</strong>並在地圖留一行。</li><li>兩種模式：<strong>Chart the map</strong>（命名目的地→廣度拷問→建地圖→建票→第二輪才接阻擋邊→平行開 research subagent→停）；<strong>Work through the map</strong>（載入地圖→挑票並認領→解→寫 resolution comment＋關票＋更新 Decisions so far→畢業迷霧／調整票）。</li><li>鐵律：<strong>一個 session 最多解一張票</strong>（research 票例外），因為每張票都該吃掉一個完整 context。</li></ol>","output":"<p>一個 <code>wayfinder:map</code> issue ＋ N 張決策 child issues（含原生阻擋邊）。</p>","when":"<p>「這是全新專案，我不知道從哪開始」「這個功能大到一個 session 做不完」「方向還很霧」。</p>","confuse":"<p><code>wayfinder</code> <strong>只產出決策，不產出交付物</strong>（除非地圖 Notes 明確覆寫）。它明確警告：不要從地圖直接跳 <code>implement</code>，否則會丟掉摺疊後的細節；正常是接到 <code>to-spec</code>。</p>","next":"<p>地圖清楚後 → <code>to-spec</code>（把連結的決策摺成可建設計畫）→ <code>to-tickets</code> → <code>implement</code>。</p>"},"to-spec":{"one":"<p>把<strong>目前對話</strong>直接濃縮成 spec／PRD 並發到 issue tracker——不訪談、只綜合。</p>","disease":"<p>拷問完的共識只存在對話裡，換 session 就蒸發；或規格東一句西一句，實作時各憑想像。</p>","mech":"<ol><li><strong>不問你問題</strong>（這是它跟拷問類最大的差別），直接吃對話＋codebase 現況。</li><li>先探索 repo；全程使用專案詞彙表（<code>CONTEXT.md</code>），尊重該區的 ADR。</li><li><strong>先畫測試接縫（seams）</strong>：優先沿用既有接縫、用<strong>最高</strong>的接縫；新增接縫要提在你能提的最高點；接縫越少越好，<strong>理想是 1 個</strong>。畫完<strong>先跟你確認</strong>再接下去寫。</li><li>用固定模板寫 spec：</li></ol>\n<ul><li><code>Problem Statement</code>（使用者視角的問題）</li><li><code>Solution</code>（使用者視角的解）</li><li><code>User Stories</code>（<strong>長</strong>的編號清單，<code>As a … I want … so that …</code>，要極度完整）</li><li><code>Implementation Decisions</code>（模組、介面、技術確認、架構決策、schema、API 契約、互動；<strong>不要放檔案路徑或程式碼</strong>，唯一例外是原型產出的決策密集片段）</li><li><code>Testing Decisions</code>（什麼算好測試＝只測外部行為；哪些模組要測；同類測試的 prior art）</li><li><code>Out of Scope</code>、<code>Further Notes</code></li></ul>\n<ol start=\"5\"><li>發佈到 tracker 並貼上 <code>ready-for-agent</code> label——<strong>不需要再 triage</strong>。</li></ol>","output":"<p>tracker 上一份 spec issue。</p>","when":"<p><code>grill-with-docs</code>／<code>wayfinder</code> 剛結束、共識新鮮；或你想把一段討論「存檔成可驗收文件」。</p>","confuse":"<p>它不會幫你補洞——洞沒在對話裡出現過，spec 就會缺。缺洞請先回去 <code>grill-me</code>。</p>","next":"<p><code>to-tickets</code>。</p>"},"to-tickets":{"one":"<p>把計畫／spec 拆成 tracer-bullet 任務票，每張宣告「被誰擋住」，形成可並行的任務圖。</p>","disease":"<p>spec 一大段，AI 一次做整份會爛尾；或拆成「先做 schema、再做 API、再做 UI」的水平切片，結果每個階段都無法驗證。</p>","mech":"<ol><li>收集脈絡：用對話內容；若有參數（spec 路徑、issue 編號／URL）就抓全文與留言。</li><li>（選擇性）探索 codebase，順便找 <strong>prefactor</strong> 機會——「先讓變更容易，再做容易的變更」。</li><li><strong>切垂直切片</strong>，四條規則：</li></ol>\n<ul><li>每片穿過每一層（schema、API、UI、測試）的窄但<strong>完整</strong>路徑（垂直，不是水平）；</li><li>完成後可獨立 demo／驗證；</li><li>大小要能塞進<strong>一個全新 context window</strong>；</li><li>prefactor 先做完。</li></ul>\n<ol start=\"4\"><li><strong>例外：wide refactor</strong>（改名、改型別這種衝擊半徑橫跨全庫的機械變更）不能硬切垂直片，改用 <strong>expand–contract</strong>：先加新形式（什麼都不壞）→ 按衝擊半徑分批遷移呼叫端（每批一張票，被 expand 擋住）→ 最後刪舊形式（被所有批次擋住）。連批次都無法單獨維持綠燈時，讓它們共用整合分支，全部被「最終整合驗證票」擋住。</li><li><strong>跟你對答案</strong>：列出每張票的「標題／Blocked by／這票讓什麼端到端行為成立」，問三件事——粒度對不對、阻擋邊界是否只依賴真正擋它的票、有沒有該合併或再拆。</li><li>發佈：</li></ol>\n<ul><li><strong>本地 markdown</strong> → <code>.scratch/&lt;feature-slug&gt;/issues/&lt;NN&gt;-&lt;slug&gt;.md</code>，從 <code>01</code> 依依賴排序（阻擋者在前），<strong>一票一檔</strong>，絕不合成一份。</li><li><strong>真 tracker</strong> → 依依賴順序建 issue，用平台原生 blocking／sub-issue；沒有就用「Blocked by」欄位；預設貼 <code>ready-for-agent</code>。</li></ul>\n<ol start=\"7\"><li>工作時只取<strong>前線</strong>（所有阻擋者都已完成的票）。<strong>不要關閉或修改父 issue。</strong></li></ol>","output":"<p>一組帶阻擋邊的 tickets（本地檔案或 tracker issue）。</p>","when":"<p>spec 已存在但「一次做不完」；或你想讓多個 agent／多人並行。</p>","confuse":"<p><code>wayfinder</code> 的票是<strong>決策</strong>（要「想清楚」），<code>to-tickets</code> 的票是<strong>交付</strong>（要「做出來」）。</p>","next":"<p><code>implement-spec</code>（並行衝完整份）或逐票 <code>implement</code>。</p>"},"to-questionnaire":{"one":"<p>把你<strong>答不了</strong>的決策，變成分給別人填的問卷。</p>","disease":"<p>卡在別人的知識上（客戶才知道的規則、維運才知道的流量），但直接問又會問得太散、来回三輪。</p>","mech":"<p>關鍵在「<strong>只拷問寄送，不拷問主題</strong>」：</p>\n<ol><li><strong>寄給誰？</strong>（一輪問完）角色、專業、跟你的關係 → 決定語氣與要帶多少背景。完成條件：你知道對方擁有什麼你沒有的知識。</li><li><strong>要拿回什麼？</strong>（一輪問完）你一個人決定不了的具體決策／事實清單。完成條件：清單具體到「拿到答案後你能做什麼」。</li><li>寫檔 <code>to-questionnaire-&lt;slug&gt;.md</code> 到目前目錄，回報路徑。</li><li>文件結構：<code>Purpose</code>／<code>From–To–How your answers will be used</code>／<code>Context</code>（一段，夠答就好）／<code>How to answer</code>（期限、大概工時、部分答案與「我不知道」也有用）／每個主題一個 <code>##</code>（<strong>最重要先問</strong>，因為 async 可能只有一次機會）／每題一個概念、下方留回答欄、必要時加一行 _why this matters_／<code>Anything else?</code> 收尾。</li></ol>","output":"<p>一份可直接寄出的 Markdown 問卷。</p>","when":"<p>「這件事只有我老闆知道」「我需要客戶確認規格，但不想開會」。</p>","confuse":"<p><code>grill-me</code> 問<strong>你</strong>；<code>to-questionnaire</code> 設計一套問題去問<strong>別人</strong>。</p>","next":"<p>拿回答案 → <code>grill-me</code>（補細節）→ <code>to-spec</code>。</p>"},"boundary-driven":{"one":"<p>有 deadline 的專案排程器——5 小時任務塊 → 7 天週程 → 31 天三個檢查點，寫進 Notion。</p>","disease":"<p>期限專案「知道要做什麼但排不出來」，或排了卻沒有可檢查的節點，最後一週才發現落後。</p>","mech":"<p>把專案拆成 5h 可完成的任務塊 → 攤成 7 日週程 → 按 31 天比例推出三個檢查點 → 寫入 Notion「邊界驅動任務」表 → 交付檢查點清單（讓你手動放進日曆）。</p>","output":"<p>Notion 表 ＋ 檢查點清單。</p>","when":"<p>「幫我排這個月」「這是 30 天內要交的專案」「查體溫」（進度檢查）。</p>","confuse":"<p><code>to-tickets</code> 管的是<strong>依賴關係</strong>（誰擋誰），<code>boundary-driven</code> 管的是<strong>時間邊界</strong>（哪一天該到哪）。</p>","next":"<p>每日執行用 <code>goal-loop</code>；落地項用 <code>to-tickets</code>。</p>"},"implement-spec":{"one":"<p>一次把整份 spec 做完——把 tickets 當任務圖，對前線平行開背景實作 agent，最後統一收尾。</p>","disease":"<p><code>implement</code> 一次只能做一票，10 張票就是 10 個 session；明明無依賴的票可以同時做，卻被迫排隊。</p>","mech":"<ol><li>讀 spec 與 tickets，理解<strong>任務圖</strong>（不是步驟清單）。</li><li>（選擇性）先派<strong>探索 subagent</strong> 做功課，筆記存在 <strong>repo 之外</strong>的目錄，讓後續實作者不用重讀 codebase。</li><li>建<strong>整合分支（integration branch）</strong>。若 tracker 以 PR 結案（或你要），在<strong>第一次合併後</strong>才開 draft PR（分支沒領先 main 就開不了），標記為關閉 spec 與相關票。</li><li>每張票派一個<strong>全新的實作者 subagent</strong>，各自在自己的 worktree／分支，且必須：</li></ol>\n<ul><li>開工前確認 worktree 基於整合分支，不是就 reset 上去；</li><li>呼叫 <code>tdd</code> 建這張票；</li><li>回報完成前，把整合分支最新 tip 併進自己的分支。</li></ul>\n<ol start=\"5\"><li>每張票完成 → 派<strong>合併 subagent</strong>把它併回整合分支。</li><li>合併改變了前線 → 再開更多實作者處理新票（最大並行）。</li><li>全部完成 → 在整合分支上呼叫 <code>code-review</code>；所有問題交給<strong>單一全新的實作者</strong>一次修完。</li><li>有 draft PR 就轉 ready；沒有就依 tracker 方式逐票結案，並回報整合分支。</li><li>清掉所有實作者 worktree。</li></ol>\n<p><strong>運作紀律</strong>：每個 subagent <strong>全新 context</strong>；通訊<strong>極簡</strong>，只傳「脈絡指標」（指向 spec、票、研究筆記、先前 commit），不要複製貼上既有資訊。</p>","mechHint":"9 步","output":"<p>一條整合分支（＋可選 PR），每張票依 tracker 規則結案。</p>","when":"<p>spec＋tickets 已存在，且票之間真的有 blocking 關係；你想要「一次跑完一整份」。</p>","confuse":"<p>票之間若沒有依賴（任務圖是平的），全部票會同時開跑，等於只是「比較慢的 implement」；上游文件說得很直白。</p>","next":"<p><code>code-review</code>（它自己會跑）→ 轉 ready PR → <code>triage</code>／<code>qa</code> 收後續 issue。</p>"},"implement":{"one":"<p>依 spec 或<strong>單張</strong>票動手做，在約定接縫處跑 TDD，結束前自我審查再 commit。</p>","disease":"<p>AI 一次吃太多、跨票亂改；或沒有「做完的定義」，永遠在「差不多了」。</p>","mech":"<ol><li>實作 spec／tickets 描述的工作。若你傳了票的引用，<strong>先從 tracker 抓下來並說出標題</strong>；引用模糊就先問（給 URL 或 <code>owner/repo#2</code> 可消除歧義）。</li><li>盡可能在<strong>事先約定的接縫</strong>呼叫 <code>tdd</code>。</li><li><strong>常跑 typecheck、常跑單一測試檔</strong>，最後<strong>完整</strong>跑一次測試套件。</li><li>完成後呼叫 <code>code-review</code> 審查。</li><li>commit 到<strong>目前分支</strong>（它不開分支、也不問）。</li></ol>","output":"<p>一個 commit（在現有分支上）。</p>","when":"<p>一次做一張票、想逐步盯 red-green；或工作小到不需要 spec。</p>","confuse":"<p><code>implement-spec</code>＝並行＋整合分支＋merger；<code>implement</code>＝單票、單 context、直接 commit。</p>","next":"<p>下一張票再 <code>implement</code>；全做完 <code>code-review</code>。</p>"},"tdd":{"one":"<p>red → green 的紀律手冊——定義什麼是好測試、測試放哪、哪些反模式會讓測試變廢。</p>","disease":"<p>測試寫成「實作說明書」，改個內部結構就紅一片；或先寫一大批量測（horizontal slicing），驗證的是想像中的行為。</p>","mech":"<ol><li>探索時讀 <code>CONTEXT.md</code>，讓測試名稱與介面詞彙對齊領域語言；尊重 ADR。</li><li><strong>好測試的定義</strong>：透過<strong>公開介面</strong>驗證<strong>行為</strong>，不碰實作細節；讀起來像規格（「user can checkout with valid cart」）；重構後仍活得下來。</li><li><strong>接縫（seam）＝你測試的公開邊界</strong>。硬規則：<strong>寫任何測試前，先寫下要測的接縫並跟你確認</strong>；未確認的接縫不寫測試。理由是「測不完，先約定接縫才能把力氣花在關鍵路徑」。</li><li><strong>三個反模式</strong>：</li></ol>\n<ul><li>*Implementation-coupled*：mock 內部協作者、測 private、繞側通道驗證（直接查 DB）。判斷法：重構後測試壞掉，但行為沒變。</li><li>*Tautological*：斷言用跟程式一樣的算法重算期望值（<code>expect(add(a,b)).toBe(a+b)</code>、手算快照、常數自比），<strong>通過是構造出來的</strong>。期望值必須來自獨立來源：已知正確的字面值、算過的範例、spec。</li><li>*Horizontal slicing*：先寫完所有測試再寫實作 → 測的是「形狀」不是行為。要改成垂直切片：一個測試 → 一個實作 → 重複，每個測試是 tracer bullet。</li></ul>\n<ol start=\"5\"><li><strong>迴圈規則</strong>：紅先於綠；一次一個接縫、一個測試、一份最小實作；<strong>重構不屬於這個迴圈</strong>（屬 <code>code-review</code> 階段）。</li></ol>","output":"<p>一組貼著接縫的行為測試 ＋ 最小實作。</p>","when":"<p>要新增行為／修 bug 且想要護欄；<code>implement</code>／<code>implement-spec</code> 內部會呼叫它；也可單獨用（沒有 spec 也行）。</p>","confuse":"<p>它不是「補測試」工具，是<strong>開發節奏</strong>；順序反了（先寫實作再補測）就不叫 TDD。</p>","next":"<p><code>code-review</code>（重構在那裡做）。</p>"},"code-review":{"one":"<p>從固定點做雙軸平行審查——「有沒有照規矩寫」與「有沒有做對的事」，兩份報告並排、不互相汙染。</p>","disease":"<p>單一審查容易被其中一軸遮蓋——碼很漂亮但做錯功能，或功能對但把專案風格打爛。</p>","mech":"<ol><li><strong>釘住固定點</strong>（commit／branch／tag／<code>HEAD~5</code>…），用 <code>git diff &lt;fixed-point&gt;...HEAD</code>（三點，對 merge-base）並記下 commit 清單。先確認 ref 可解析、diff 非空——壞 ref 要在這裡就失敗，不要掉進兩個平行 sub-agent 裡才炸。</li><li><strong>找 spec 來源</strong>（依序）：commit message 的 issue 引用 → 使用者給的路徑 → <code>docs/</code>／<code>specs/</code>／<code>.scratch/</code> 符合分支名的檔案 → 問使用者（說沒有就讓 Spec 軸回報「no spec available」）。</li><li><strong>找 standards 來源</strong>：repo 內任何寫「該怎麼寫」的文件（<code>CODING_STANDARDS.md</code>、<code>CONTRIBUTING.md</code>）。此外<strong>永遠</strong>疊上一層 <strong>Fowler 異味基線</strong>（12 種：Mysterious Name、Duplicated Code、Feature Envy、Data Clumps、Primitive Obsession、Repeated Switches、Shotgun Surgery、Divergent Change、Speculative Generality、Message Chains、Middle Man、Refused Bequest）。兩條約束：<strong>repo 文件優先</strong>（它認可的做法就壓掉異味）；<strong>異味永遠是判斷題</strong>（寫「possible Feature Envy」），且工具已管的跳過。</li><li><strong>同時開兩個 sub-agent</strong>（同一則訊息送出、都用 general-purpose），各自收到：diff 指令＋commit 清單＋（Standards 軸）標準文件清單<strong>與完整異味基線</strong>＋（Spec 軸）spec 內容；brief 要求 <strong>400 字內</strong>、要引用違反的條文／spec 行。</li><li><strong>聚合但不重排</strong>：兩份報告原樣放在 <code>## Standards</code>／<code>## Spec</code> 下，<strong>不要合併或重排名次</strong>；結尾只給「各軸發現數＋各軸最嚴重的一項」，<strong>不選跨軸總冠軍</strong>（那正是分軸要防止的事）。</li></ol>","output":"<p>兩軸對照的審查報告。</p>","when":"<p>開 PR 前；驗收 AI 產出；「review since main」。</p>","confuse":"<p>它不做修正（修是 <code>implement</code> 的事）；<code>diagnosing-bugs</code> 找的是「為什麼壞」，它找的是「哪裡不合規／不合規格」。</p>","next":"<p>修完再 review；乾淨就進 <code>triage</code>／結案。</p>"},"diagnosing-bugs":{"one":"<p>硬 bug 的六階段診斷——沒有「一個已經變紅的指令」之前，不准開始推理。</p>","disease":"<p>遇到怪 bug 就開始讀碼猜測、到處加 log、改三行試試看，改了兩天不知道哪一改才有效。</p>","mech":"<ul><li><strong>Phase 1 — 建立回饋迴圈（整個 skill 的核心）</strong>：想辦法做出一個<strong>對這個 bug 會變紅</strong>的緊訊號。原文的十種建法（大致照順序試）：失敗測試 → curl／HTTP script → CLI＋fixture diff → headless 瀏覽器（Playwright）→ 重播擷取的 trace → 一次性 harness → property／fuzz → bisection harness（可 <code>git bisect run</code>）→ 新舊版差異比對 → HITL bash script（最後手段，用 <code>scripts/hitl-loop.template.sh</code> 驅動人）。 然後<strong>把迴圈當產品來 tighten</strong>：更快（快取 setup、縮小範圍）、訊號更利（斷言具體症狀，不是「沒 crash」）、更確定（釘時間、seed RNG、隔離檔案系統、凍結網路）。30 秒不穩定的迴圈≈沒有；2 秒確定的是超能力。 非確定性 bug 的目標不是乾淨重現，而是<strong>提高重現率</strong>（跑 100 次、並行、加壓力、注入 sleep）；50% 可查，1% 不可查。 真的建不出來就<strong>停下來明說</strong>，列出試過什麼，並要：(a) 能重現的環境存取、(b) 已擷取的 artifact（HAR／log／core dump／有時間戳的錄影）、(c) 允許加暫時的 production instrumentation。<strong>沒有迴圈就不要進 Phase 2。</strong> <strong>完成標準（四項全勾）</strong>：red-capable（驅動真實路徑且斷言使用者講的症狀）、deterministic、fast（秒級）、agent-runnable；而且要<strong>已經跑過至少一次</strong>並貼出指令與輸出。</li><li><strong>Phase 2 — 重現＋最小化</strong>：先確認迴圈紅的是<strong>同一個</strong> bug（不是旁邊剛好也壞的東西），擷取精確症狀；然後一次砍一個輸入／呼叫者／設定／資料／步驟，砍到「每個留下的元素都是承重的」——拿掉任一個就變綠。最小重現會縮小 Phase 3 的假設空間，也會變成 Phase 5 的迴歸測試。</li><li><strong>Phase 3 — 假設</strong>：先產生 <strong>3–5 個排序過的假設</strong>（只有一個會錨定在第一個合理想法）。每個都要<strong>可否證</strong>：「若 X 是原因，那麼改 Y 會讓 bug 消失／改 Z 會更糟」。講不出預測的就是感覺，丟掉或銳化。<strong>測試前先把排序清單給使用者看</strong>（省錢的檢查點，不要卡住等他）。</li><li><strong>Phase 4 — 觀測</strong>：每個探針都要對應 Phase 3 的某個預測，<strong>一次只改一個變數</strong>。優先序：debugger／REPL ＞ 針對性 log ＞（禁止）log 全部再 grep。每個 debug log 加唯一前綴（例如 <code>[DEBUG-a4f2]</code>），收尾用一次 grep 清掉。<strong>效能分支</strong>例外：log 通常沒用，先建立 baseline（計時 harness／profiler／query plan）再二分。</li><li><strong>Phase 5 — 修＋迴歸測試</strong>：<strong>先寫迴歸測試再修</strong>，但<strong>前提是有正確的接縫</strong>——測試要在 bug 真實發生的呼叫模式上失敗；太淺的接縫（單一呼叫者、無法重現鏈路）只會給你假信心。<strong>若沒有正確接縫，這件事本身就是發現</strong>：架構擋住了把 bug 鎖死，記下來交給下一步。</li><li><strong>Phase 6 — 清理＋事後檢討</strong>：原重現不再發生、迴歸測試通過（或記錄沒有接縫）、所有 <code>[DEBUG-...]</code> 清掉、一次性原型刪掉、<strong>把「哪個假設對」寫進 commit／PR</strong>。最後問「什麼能預防這個 bug？」——若答案是架構性的（沒好接縫、呼叫糾纏、隱性耦合），在修完<strong>之後</strong>交給 <code>improve-codebase-architecture</code>。</li></ul>","output":"<p>最小重現、迴歸測試、修正、事後檢討。</p>","when":"<p>一看就懂的錯不用它；它針對「第一眼看不出、間歇性、兩個已知良好狀態之間冒出來的退化」。</p>","confuse":"<p><code>code-review</code> 看的是 diff 合規，<code>diagnosing-bugs</code> 看的是因果。</p>","next":"<p><code>tdd</code>（補測試）→ <code>code-review</code>；架構問題 → <code>improve-codebase-architecture</code>。</p>"},"triage":{"one":"<p>把<strong>別人丟進來</strong>的 issue／外部 PR，用狀態機分類、驗證、必要時拷問，最後寫成「agent 可接」的 brief。</p>","disease":"<p>issue 堆積但沒人判斷「能不能丟給 AI」；或 AI 接到一句「壞了」就開始亂修。</p>","mech":"<ol><li><strong>角色</strong>：2 個分類（<code>bug</code>／<code>enhancement</code>）＋ 5 個狀態（<code>needs-triage</code>／<code>needs-info</code>／<code>ready-for-agent</code>／<code>ready-for-human</code>／<code>wontfix</code>）。每個 issue 必須<strong>恰好一個分類＋一個狀態</strong>；狀態衝突先問 maintainer。實際標籤字串可能不同（由 <code>setup-matt-pocock-skills</code> 的映射決定）。</li><li><strong>狀態轉移</strong>：未標 → <code>needs-triage</code> → <code>needs-info</code>／<code>ready-for-agent</code>／<code>ready-for-human</code>／<code>wontfix</code>；<code>needs-info</code> 在回報者回覆後回到 <code>needs-triage</code>。異常轉移先問。</li><li><strong>AI 免責</strong>：triage 期間在 tracker 發的<strong>每個</strong>留言／issue 都要以 <code>&gt; *This was generated by AI during triage.*</code> 開頭。</li><li><strong>看需要處理什麼</strong>：三個桶（最舊優先）——未標、<code>needs-triage</code>、<code>needs-info</code> 且回報者有新活動；外部 PR 進同一批並標 <code>[PR]</code>／<code>[issue]</code>。</li><li><strong>處理單一 issue 五步</strong>：</li></ol>\n<ul><li>收集脈絡（內文、留言、label、作者、日期；PR 另讀 diff；解析舊 triage 筆記避免重問），並做兩項 codebase 檢查：<strong>冗餘</strong>（用領域概念而非請求字面去搜是否已實作）與<strong>先前否決</strong>（讀 <code>.out-of-scope/*.md</code>）。</li><li><strong>建議</strong>分類與狀態＋理由＋相關程式碼摘要（含是否已實作），等你指示。</li><li><strong>驗證claim</strong>：bug 就照步驟重現；PR 就 checkout 跑相關測試。回報 confirmed（含程式路徑）／failed／資訊不足（強烈 <code>needs-info</code> 訊號）。</li><li><strong>必要時拷問</strong>：用 <code>/grill-me</code> ＋ <code>/domain-modeling</code>，一次一題，邊把決策寫回 <code>CONTEXT.md</code>／ADR。</li><li><strong>套用結果</strong>：<code>ready-for-agent</code> 發 agent brief；<code>ready-for-human</code> 同結構但要說明為何不能委派（判斷、外部存取、設計決策、需人工測試）；<code>needs-info</code> 發 triage notes（已確立／還需要什麼）；<code>wontfix</code> 分三種——已實作（指出在哪，<strong>不寫</strong> <code>.out-of-scope/</code>）、否決 bug（禮貌說明後關）、否決 enhancement（寫 <code>.out-of-scope/</code>、留言連結、關閉）。</li></ul>\n<ol start=\"6\"><li><strong>快速覆寫</strong>：maintainer 說「移到 ready-for-agent」就照做，跳過拷問；但要先確認即將做的事（改 label、留言、關閉）。沒拷問就要問「要不要寫 agent brief」。</li><li><strong>接續舊 session</strong>：先讀既有 triage notes、看回報者有沒有回答、給更新後的畫面，不要重問已解決的。</li></ol>","output":"<p>分好類的 issue＋agent brief（或 needs-info 清單／wontfix 記錄）。</p>","when":"<p>issue／PR 堆積；「這些哪些能丟給 agent？」「幫我看 #42」。</p>","confuse":"<p><code>to-tickets</code> 產出的票<strong>已經是</strong> agent-ready，<strong>不要再 triage</strong>（上游明文）。<code>triage</code> 只處理「不是你建立的」原始請求。</p>","next":"<p><code>ready-for-agent</code> → <code>implement</code>；<code>needs-info</code> → 等回覆；一批同類 bug → <code>qa</code> 補完整描述。</p>"},"qa":{"one":"<p>對話式 QA——你口述問題，它背景讀 codebase 學領域語言，然後<strong>直接</strong>開 GitHub issue（不先給你審）。</p>","disease":"<p>bug 只在腦子裡／口頭上，沒有變成可追蹤、可重現、撐得過重構的 issue。</p>","mech":"<ol><li><strong>聽＋輕度澄清</strong>：最多 <strong>2–3 個</strong>短問題（預期 vs 實際、重現步驟、穩定或間歇）。描述夠清楚就別審問。</li><li><strong>背景探索</strong>：同時派 <code>Explore</code> subagent 理解該區——目標<strong>不是找修法</strong>，而是學領域語言（看 <code>UBIQUITOUS_LANGUAGE.md</code>）、知道功能該做什麼、找出使用者可見的行為邊界。</li><li><strong>判斷單一或拆分</strong>：跨多個獨立面向、可分頭並行、或多個不同失敗模式 → 拆；同一行為在同一處錯、症狀同源 → 單一。</li><li><strong>建 issue</strong>（<code>gh issue create</code>，建完再給 URL）：模板 <code>What happened</code>／<code>What I expected</code>／<code>Steps to reproduce</code>／<code>Additional context</code>（拆分版多 <code>Parent issue</code> 與 <code>Blocked by</code>）。拆分時<strong>依依賴順序建</strong>（阻擋者先）才能引用真號碼；「寧可多張薄 issue，不要少張厚 issue」；blocking 關係誠實標；目標是最大化並行。</li><li><strong>規則</strong>：不寫檔案路徑／行號（會過時）、用專案領域語言、描述<strong>行為</strong>不描述程式碼（「sync service 套不上 patch」而非「applyPatch() 第 42 行丟錯」）、<strong>重現步驟必填</strong>（問不出來就問使用者）、30 秒讀得完。建完印出所有 URL 與阻擋關係，問「下一個，還是收工？」</li></ol>","mechHint":"每個 issue 五步","output":"<p>一批 GitHub issue（含阻擋關係）。</p>","when":"<p>「我要回報幾個 bug」「開個 QA session」。</p>","confuse":"<p><code>qa</code> 只<strong>記錄</strong>問題，不判斷能不能交給 agent（那是 <code>triage</code>）；也不查根因（那是 <code>diagnosing-bugs</code>）。</p>","next":"<p><code>triage</code>（分類）→ <code>implement</code>／<code>diagnosing-bugs</code>。</p>"},"request-refactor-plan":{"one":"<p>訪談式重構規劃——把重構拆成「每一步都還能跑」的極小 commit，最後開成一張 GitHub issue。</p>","disease":"<p>重構衝動一來就大改，改到一半程式不能跑，只好全部回滾。</p>","mech":"<ol><li>要你<strong>詳細</strong>描述問題與可能解法。</li><li>探索 repo <strong>驗證你的說法</strong>、理解現況。</li><li>問你有沒有考慮其他選項，並主動提出其他選項。</li><li>針對實作細節做<strong>極詳細</strong>訪談。</li><li>敲定精確範圍：要改什麼、<strong>不改</strong>什麼。</li><li>查該區<strong>測試覆蓋</strong>；不足就問你的測試計畫。</li><li>拆成<strong>極小 commit</strong> 計畫，引用 Fowler：「讓每個重構步驟盡可能小，這樣你總能看到程式在運作。」</li><li>開 GitHub issue，模板：<code>Problem Statement</code>／<code>Solution</code>／<code>Commits</code>（長而細，每步都留下可運作狀態）／<code>Decision Document</code>（模組、介面、技術確認、架構決策、schema、API 契約；<strong>不放檔案路徑與程式碼</strong>）／<code>Testing Decisions</code>／<code>Out of Scope</code>／<code>Further Notes</code>。</li></ol>","mechHint":"8 步，可跳過你覺得不必要的","output":"<p>一張含逐步 commit 計畫的 refactor issue。</p>","when":"<p>「我想重構這塊但不敢動」「幫我寫重構 RFC」。</p>","confuse":"<p><code>improve-codebase-architecture</code> 是<strong>掃描找候選</strong>（設計視角），<code>request-refactor-plan</code> 是<strong>你已決定要重構之後的施工計畫</strong>。</p>","next":"<p><code>implement</code>（照 commit 逐步走）→ <code>code-review</code>。</p>"},"improve-codebase-architecture":{"one":"<p>掃 codebase 找「深化機會」，做成視覺化 HTML 報告，再由你挑一個深入拷問。</p>","disease":"<p>模組又淺又碎，改一個概念要跳五個檔案；或為了可測性抽出一堆純函式，真正的 bug 藏在呼叫方式裡。</p>","mech":"<ol><li><strong>先 scoping 再掃（YAGNI）</strong>：深化是為了讓<strong>未來修改</strong>更容易，所以優先看<strong>最近常改</strong>的地方。你指定方向就用你的；否則看 <code>git log --oneline</code> 找熱點；沒有熱點就放大範圍。先讀 <code>CONTEXT.md</code> 與該區 ADR。</li><li>用 <code>Explore</code> subagent 有機地走，注意摩擦點：理解一個概念要跳多少模組？哪裡<strong>淺</strong>（介面跟實作一樣複雜）？哪裡為了測試抽純函式卻失去 <strong>locality</strong>？哪裡耦合洩漏過接縫？哪裡沒測或測不進去？</li><li>對可疑的淺模組做<strong>刪除測試</strong>：刪掉它，複雜度是「集中起來」（訊號）還是「只是搬家」（pass-through）？</li><li><strong>產出 HTML 報告</strong>到 OS 暫存目錄（<code>$TMPDIR</code>，絕不落 repo）：Tailwind＋Mermaid CDN；每張候選卡有 <code>Files</code>／<code>Problem</code>／<code>Solution</code>／<code>Benefits</code>（用 locality 與 leverage 講，並說測試怎麼變好）／<strong>before-after 視覺</strong>／<strong>建議強度</strong>（<code>Strong</code>／<code>Worth exploring</code>／<code>Speculative</code>）；最後給 <code>Top recommendation</code>。詞彙要用 <code>CONTEXT.md</code>（領域）＋<code>codebase-design</code>（架構），不要說「service」「component」。</li><li><strong>ADR 衝突</strong>：只有摩擦大到值得重開 ADR 才提，並在卡片明確標註（「與 ADR-0007 衝突，但值得重開因為…」）。</li><li><strong>先不提介面</strong>，只問你「想探索哪一個？」</li><li>你挑了之後進<strong>拷問迴圈</strong>（<code>/grill-me</code>）：約束、依賴、深化後的形狀、接縫後面是什麼、哪些測試能活。決策落定時<strong>即時</strong>用 <code>/domain-modeling</code> 更新 <code>CONTEXT.md</code>；你以承重理由否決某候選時，<strong>提議寫成 ADR</strong>（只在那理由未來真的需要被知道時才提）；要比較介面就進 <code>design-an-interface</code> 的 design-it-twice。</li></ol>","output":"<p>一份 HTML 報告（含 before/after 圖）＋（若繼續）深化的設計共識與文件更新。</p>","when":"<p>「有時間就保養 codebase」「AI 在這專案很容易迷路」「這塊改起來很痛」。</p>","confuse":"<p>它是<strong>調查</strong>（找候選），不是施工；施工走主流程。</p>","next":"<p>選定的候選 → <code>grill-with-docs</code> → <code>to-spec</code> → <code>implement</code>。</p>"},"codebase-design":{"one":"<p>深模組的<strong>共同詞彙與原則</strong>——整個套件（<code>tdd</code>、<code>improve-codebase-architecture</code>）共用的語言底座。</p>","disease":"<p>大家講「component／service／API／boundary」各說各話，設計討論永遠對不上焦。</p>","mech":"<p>先定義 8 個詞（並明令不得替換）：</p>\n<ul><li><strong>Module</strong>：任何有介面＋實作的東西，刻意不分尺度（函式、class、package、跨層切片）。不要說 unit／component／service。</li><li><strong>Interface</strong>：呼叫者必須知道的<strong>一切</strong>——型別簽章外，還有不變量、順序約束、錯誤模式、必要設定、效能特性。不要說 API／signature（太窄）。</li><li><strong>Implementation</strong> 與 <strong>Adapter</strong> 的差別：adapter 講「角色」（填哪個洞），implementation 講「裡面有什麼」。</li><li><strong>Depth</strong>：介面上的 leverage——呼叫者／測試每學一單位介面能驅動多少行為。深＝小介面藏大量行為；淺＝介面跟實作一樣複雜。</li><li><strong>Seam</strong>（Feathers）：能改行為而不必改那個位置的地方；模組介面所在的位置。不要說 boundary（與 DDD 混淆）。</li><li><strong>Leverage</strong>（呼叫者得到什麼）／<strong>Locality</strong>（維護者得到什麼：改動、bug、知識、驗證都集中一處）。</li><li><strong>四個原則</strong>：depth 是<strong>介面</strong>的屬性不是實作的（內部可以有 internal seams）；<strong>刪除測試</strong>；<strong>介面就是測試面</strong>（想測到介面之後，通常是模組形狀錯了）；<strong>一個 adapter＝假設的接縫，兩個才是真的接縫</strong>。</li><li><strong>可測試性三招</strong>：依賴用傳入不要自己 new；回傳結果不要產生副作用；表面積越小越好。</li><li><strong>明確否決的說法</strong>：Ousterhout 的「實作行數／介面行數」比值（會獎勵灌水實作）；把 interface 當 TS 的 <code>interface</code> 關鍵字；用 boundary 指涉 seam。</li></ul>","output":"<p>共同語言（不產生檔案）。</p>","when":"<p>「這介面該切在哪」「怎麼讓它可測」「這個模組是不是太淺」；或 <code>tdd</code>／<code>improve-codebase-architecture</code> 需要詞彙時。</p>","confuse":"<p><code>design-an-interface</code> 是<strong>產出多個具體設計</strong>；<code>codebase-design</code> 是<strong>判斷好壞的尺</strong>。</p>","next":"<p><code>design-an-interface</code>（實際設計）或 <code>to-spec</code>（把決定寫下來）。</p>"},"design-an-interface":{"one":"<p>Design It Twice——同時讓多個 agent 用<strong>不同約束</strong>設計同一模組，再比較取捨。</p>","disease":"<p>第一個想到的介面通常不是最好的，但一個人很難跳出自己的框架。</p>","mech":"<ol><li><strong>先蒐需求</strong>：這模組解決什麼、誰是呼叫者、關鍵操作、限制（效能／相容／既有模式）、什麼該藏什麼該露。</li><li><strong>平行開 3+ 個 sub-agent</strong>，每個給<strong>不同約束</strong>（例：1–3 個方法以內／最大化彈性／最佳化最常見情境／借鏡某個 paradigm 或 library）。每個都要交出：介面簽章、使用範例、藏了什麼、取捨。強制<strong>radically different</strong>。</li><li><strong>逐個呈現</strong>（不是並排丟出），每個都給簽章、實際用法、藏了什麼。</li><li><strong>比較</strong>五個維度：介面簡潔度、通用 vs 專用、實作效率（形狀會不會逼出彆扭的內部）、<strong>深度</strong>（小介面藏大量行為 vs 大介面薄實作）、正確使用容易度 vs 誤用容易度。<strong>用散文討論取捨，不要表格</strong>，並指出分歧最大的地方。</li><li><strong>合成</strong>：常最好的設計是取多家之長——問「哪個最貼主要用例」「有沒有別人的元素值得併入」。</li></ol>\n<p><strong>反模式</strong>（原文列舉）：不要讓 agent 產出相似的設計；不要跳過比較（價值在對比）；<strong>不要實作</strong>（純談介面形狀）；不要用「實作成本」評估。</p>","output":"<p>數個具體介面方案＋比較＋合成建議。</p>","when":"<p>「這個模組 API 該長怎樣」「設計兩次看看」。</p>","confuse":"<p><code>prototype</code> 用<strong>程式碼</strong>回答問題；<code>design-an-interface</code> 只用<strong>紙上設計</strong>回答問題。</p>","next":"<p><code>to-spec</code>（把選定形狀寫進 Implementation Decisions）。</p>"},"setup-ts-deep-modules":{"one":"<p>把「每個 package 都是深模組」變成 CI 會擋的規則——實作藏在子資料夾，只能從入口檔進來。</p>","disease":"<p>講好要模組化，但只要沒有機器擋，三個月後就出現 <code>import { x } from \"@app/order/lib/internal/impl\"</code>。</p>","mech":"<ol><li><strong>形狀</strong>：package 的<strong>根目錄檔案</strong>就是公開面（可以有多個入口：<code>index.ts</code>、<code>client.ts</code>、<code>server.ts</code>）；<strong>任何子資料夾都是私有</strong>；慣例上實作放 <code>lib/</code>、測試放 <code>tests/</code>。</li><li><strong>四條 error 規則</strong>（用 dependency-cruiser）：外部只能 import 入口檔、package 內部檔案互通自由、測試只能走各 package 入口（連自己的 internals 也不行）、<strong>不准循環依賴</strong>。</li><li><strong>入口不是 barrel</strong>：公開面是「每個根檔案」，所以不要用一個大 <code>index.ts</code> 再 re-export 整個子樹。</li><li><strong>七個步驟</strong>：偵測環境（套件管理器／packages root／是否已有 config，有就 merge 不覆蓋）→ 安裝 dependency-cruiser → 複製 <code>.dependency-cruiser.cjs</code> 並設 <code>PACKAGES_ROOT</code> → 加 <code>lint:boundaries</code> 並<strong>併進原本跑 typecheck 的 umbrella 指令</strong>（不動 tsconfig、不加 path alias）→ 建 <code>example/</code> 範本 package（入口 → <code>lib/impl.ts</code>，測試只 import 入口）→ <strong>證明規則會咬</strong>（pass → 故意加 deep import 必須 fail → 還原再 pass，這是整體完成標準）→ 寫 <code>packages/README.md</code> 並從 <code>CLAUDE.md</code>／<code>AGENTS.md</code> 留一行 context pointer。</li><li><strong>技術註記</strong>：<code>$1</code> back-reference 讓 package 能碰自己的 internals 而外部不行，不要拆成 per-package 規則；用 <code>.cjs</code> 以相容 <code>\"type\": \"module\"</code>。</li></ol>","output":"<p><code>lint:boundaries</code> 檢查、<code>.dependency-cruiser.cjs</code>、範本 package、邊界文件。</p>","when":"<p>TS 新專案開場；或既有專案邊界已經爛掉、想一次上鎖。</p>","confuse":"<p>它只管<strong>邊界</strong>（誰能 import 誰），不管<strong>分層</strong>（哪層能依賴哪層，config 裡只留註解 stub）。</p>","next":"<p><code>codebase-design</code>（設計入口形狀）→ <code>implement</code>。</p>"},"domain-modeling":{"one":"<p>主動打磨專案的<strong>領域語言</strong>——術語一有結論就立刻寫進 <code>CONTEXT.md</code>，值得的決策寫成 ADR。</p>","disease":"<p>「account」同時指 Customer 和 User；規格與程式對同一個詞有不同理解；三個月後沒人記得為什麼這樣設計。</p>","mech":"<ol><li><strong>檔案佈局</strong>：單一 context → 根目錄 <code>CONTEXT.md</code> ＋ <code>docs/adr/</code>；若根目錄有 <code>CONTEXT-MAP.md</code> 就是多 context，各自 <code>src/&lt;context&gt;/CONTEXT.md</code> ＋ 自己的 ADR。<strong>按需建立</strong>，不預鋪空殼。</li><li><strong>對話中的五個動作</strong>：</li></ol>\n<ul><li><strong>對照詞彙表挑戰</strong>：「你的 glossary 把 cancellation 定義成 X，但你現在像是說 Y，是哪個？」</li><li><strong>銳化模糊詞</strong>：提精確的 canonical term（「你說 account，是指 Customer 還是 User？兩者不同」）。</li><li><strong>用具體情境壓力測試</strong>：編邊界情境逼你把概念界線講清楚。</li><li><strong>回頭對照程式</strong>：「程式取消的是整張 Order，但你剛說可以部分取消——哪個對？」</li><li><strong>即時更新 <code>CONTEXT.md</code></strong>：不要批次補；它<strong>只能是詞彙表</strong>，不是 spec、不是草稿、不放實作細節。</li></ul>\n<ol start=\"3\"><li><strong>ADR 三條件全滿足才提</strong>：難以回頭、不看脈絡會覺得奇怪、是真的取捨後的結果。缺一就別寫。</li></ol>","output":"<p><code>CONTEXT.md</code>、<code>docs/adr/NNNN-*.md</code>。</p>","when":"<p><code>grill-with-docs</code>／<code>wayfinder</code>／<code>improve-codebase-architecture</code> 內部會叫它；也可單獨用來「把話講清楚」。</p>","confuse":"<p><strong>只讀</strong> <code>CONTEXT.md</code> 取詞彙不算這個 skill；它處理的是「模型正在改變」。</p>","next":"<p><code>to-spec</code>（詞彙固定後才寫規格）。</p>"},"ubiquitous-language":{"one":"<p>一次性從<strong>目前對話</strong>抽出 DDD 式詞彙表，標出歧義、提出 canonical 用語，存成 <code>UBIQUITOUS_LANGUAGE.md</code>。</p>","disease":"<p>同上，但你要的是<strong>快照</strong>（一份可以拿去看／給人看的表），不是持續維護的紀律。</p>","mech":"<ol><li>掃對話中的領域名詞、動詞、概念。</li><li>找三種病：一詞多義、多詞同義、模糊／超載。</li><li>提出<strong>有主見</strong>的 canonical 選擇（不要列一堆「都可以」）。</li><li>寫 <code>UBIQUITOUS_LANGUAGE.md</code>：分主題的表格（<code>Term</code>／<code>Definition</code>（一句話，定義它是什麼不是它做什麼）／<code>Aliases to avoid</code>）＋ <code>Relationships</code>（基數）＋ <strong>Example dialogue</strong>（3–5 回合，示範術語怎麼自然互動）＋ <code>Flagged ambiguities</code>（明確點出並給建議）。</li><li>對話中摘要。</li><li><strong>再跑一次時</strong>：讀既有檔 → 併入新詞 → 更新定義 → 重新標歧義 → 重寫 example dialogue。</li></ol>\n<p><strong>規則</strong>：只收領域專家在乎的詞（跳過 array、function、endpoint）；跳過模組／class 名稱除非它有領域意義；定義一句話；分群只在自然浮現時才分。</p>","output":"<p><code>UBIQUITOUS_LANGUAGE.md</code>。</p>","when":"<p>「幫我建詞彙表」「這個詞我們定義一下」；<code>qa</code>／<code>to-spec</code> 之前先把詞統一。</p>","confuse":"<p><code>domain-modeling</code> 是持續紀律（會挑戰你、會改 <code>CONTEXT.md</code>）；<code>ubiquitous-language</code> 是抽取快照（寫另一個檔）。</p>","next":"<p><code>domain-modeling</code>（接手長期維護）→ <code>to-spec</code>。</p>"},"prototype":{"one":"<p>寫一段<strong>用完就丟</strong>的程式，回答一個設計問題。</p>","disease":"<p>有些設計問題在紙上永遠吵不完——狀態機感覺對不對、UI 到底長怎樣。</p>","mech":"<ol><li><strong>先選分支</strong>（選錯整支白做）：</li></ol>\n<ul><li>「這個邏輯／狀態模型對嗎？」→ 做一個<strong>小型互動終端機 app</strong>，把狀態機推過紙上很難推理的情境。</li><li>「這應該長什麼樣？」→ 在<strong>同一條 route</strong> 上做數個<strong>激進不同</strong>的 UI 變體，用 URL query param 切換＋浮動底欄。真的不確定又找不到人問，就依周邊程式碼判斷（後端模組→邏輯；頁面／元件→UI），並在原型開頭寫明假設。</li></ul>\n<ol start=\"2\"><li><strong>六條規則</strong>：從第一天就是丟棄品且<strong>命名看得出來</strong>（放在實際會被用到的地方附近）／<strong>一個指令就能跑</strong>／<strong>預設不持久化</strong>（狀態在記憶體；真要 DB 就碰 scratch DB 或叫作 <code>PROTOTYPE — wipe me</code> 的檔案）／<strong>不做打磨</strong>（不寫 <code>AGENTS.md</code>；兩者都沒有就<strong>問你要建哪個</strong>；已有 <code>## Agent skills</code> 就就地更新，不要重複附加。</li></ol>","mechHint":"prompt-driven，不是腳本；探索→呈現→確認→寫","output":"<p><code>docs/agents/issue-tracker.md</code>、<code>docs/agents/domain.md</code>、<code>docs/agents/triage-labels.md</code> ＋ agent 指示檔的一段摘要。</p>","when":"<p>新 repo 第一次；或想換 tracker／重來一次。</p>","confuse":"<p>它只寫設定，不建立任何流程狀態（不會幫你開 issue）。</p>","next":"<p><code>grill-with-docs</code>（或 <code>wayfinder</code>）。</p>"},"setup-pre-commit":{"one":"<p>裝好 Husky＋lint-staged＋Prettier＋typecheck＋test 的 commit 前檢查。</p>","disease":"<p>格式／型別／測試問題總是在 CI 才爆，或 review 時才發現。</p>","mech":"<p>偵測套件管理器（npm／pnpm／yarn／bun，不明就 npm）→ 裝 <code>husky lint-staged prettier</code> → <code>npx husky init</code> → 寫 <code>.husky/pre-commit</code>（三行：<code>npx lint-staged</code>、<code>run typecheck</code>、<code>run test</code>；沒有對應 script 就省略並告知）→ <code>.lintstagedrc</code> 用 <code>prettier --ignore-unknown --write</code> → 沒有 Prettier 設定才建 <code>.prettierrc</code>（2 空格、80 欄、雙引號、es5 trailing comma、分號）→ 驗證清單 → 用這次變更自己 commit 一次（<strong>順便當煙霧測試</strong>）。</p>","output":"<p><code>.husky/pre-commit</code>、<code>.lintstagedrc</code>、Prettier 設定、<code>prepare: husky</code>。</p>","when":"<p>新專案；或團隊一直被 CI 打回來。</p>","confuse":"<p><code>git-guardrails-claude-code</code> 擋的是<strong>危險指令</strong>，這個擋的是<strong>品質</strong>。</p>","next":"<p><code>implement</code>。</p>"},"git-guardrails-claude-code":{"one":"<p>在 Claude Code 執行前攔截危險 git 指令（push、<code>reset --hard</code>、<code>clean -f</code>、<code>branch -D</code>、<code>checkout .</code>）。</p>","disease":"<p>AI（或疲累的你）一個指令把未提交的工作清空、或把不該推的東西推上去。</p>","mech":"<p>問你要<strong>專案</strong>（<code>.claude/settings.json</code>）還是<strong>全域</strong>（<code>~/.claude/settings.json</code>）→ 複製 <code>scripts/block-dangerous-git.sh</code> 到對應 hooks 目錄並 <code>chmod +x</code> → 在 settings 的 <code>hooks.PreToolUse</code> 加一條 <code>matcher: \"Bash\"</code> 的 command hook（既有設定要<strong>合併</strong>，不要覆蓋）→ 問要不要增減攔截樣式 → 驗證：<code>echo '{\"tool_input\":{\"command\":\"git push origin main\"}}' | &lt;script&gt;</code> 應 <strong>exit 2</strong> 並在 stderr 印 BLOCKED。</p>","output":"<p>一個 hook 腳本 ＋ settings.json 的 hook 條目。</p>","when":"<p>把 repo 交給 agent 之前。</p>","confuse":"<p>它是 <strong>Claude Code</strong> 的 hook 機制，不是 git 本身的 alias／hook；在 OpenCode 不生效。</p>","next":"<p>日常開發。</p>"},"resolving-merge-conflicts":{"one":"<p>逐 hunk 解衝突，依「各方原本的意圖」解，不亂選、不 <code>--abort</code>。</p>","disease":"<p>解衝突時直接選 ours／theirs，把對方的功能默默砍掉。</p>","mech":"<p>看目前 merge／rebase 狀態與衝突檔 → <strong>找每方的 primary source</strong>（commit message、PR、原始 issue／ticket），理解每個改動<strong>為什麼</strong>做 → 逐 hunk 解：<strong>能保留雙方意圖就都保留</strong>；不相容時選符合這次 merge 目標的那個並<strong>記下 trade-off</strong>；<strong>不發明新行為</strong>；<strong>永遠解完，不 abort</strong> → 找出專案的檢查指令並跑（通常 typecheck → test → format），修掉 merge 造成的問題 → stage＋commit；rebase 就一路 continue 到完。</p>","output":"<p>解完的 merge／rebase ＋ 通過的檢查。</p>","when":"<p>卡在衝突時。</p>","confuse":"<p>不是 <code>git merge --strategy</code> 的操作指南，重點在<strong>判定意圖</strong>的流程。</p>","next":"<p><code>code-review</code>（確認合併後行為）。</p>"},"migrate-to-shoehorn":{"one":"<p>把測試裡的 <code>as</code> 斷言換成 <code>@total-typescript/shoehorn</code>，用部分資料也維持型別安全。</p>","disease":"<p>測試要傳一個 20 欄位的 <code>Request</code>，但你只在乎 <code>body.id</code>，只好 <code>as</code> 硬轉或假造全部欄位。</p>","mech":"<p><code>as</code> 的三個問題（被訓練成別用、要手動指定目標型別、故意傳錯資料要 <code>as unknown as</code>）→ 安裝 → 三種對應：大物件只給必要欄位／<code>as Type</code> → <code>fromPartial()</code>；<code>as unknown as Type</code>（故意錯）→ <code>fromAny()</code>；想先強制完整、之後再放寬 → <code>fromExact()</code> → 用 <code>grep -r \" as [A-Z]\" --include=\"*.test.ts\" --include=\"*.spec.ts\"</code> 找出所有站點替換 → 跑 typecheck。<strong>硬規則：只用在測試，絕不用在 production code。</strong></p>","output":"<p>改寫後的測試檔。</p>","when":"<p>測試被型別搞得很醜；或提到 shoehorn。</p>","confuse":"<p>這不是「加測試」，只是<strong>改寫既有測試的型別手法</strong>。</p>","next":"<p><code>tdd</code>。</p>"},"scaffold-exercises":{"one":"<p>建出能過 lint 的課程練習目錄骨架（section／exercise／problem-solution-explainer）。</p>","disease":"<p>教材目錄每次手建，命名不一致、缺 readme、連結壞掉，最後 lint 一直紅。</p>","mech":"<p>命名規則 <code>XX-section-name/</code> 與 <code>XX.YY-exercise-name/</code>（dash-case）→ 每個練習至少一種 variant：<code>problem/</code>（學生工作區，留 TODO）、<code>solution/</code>（參考解）、<code>explainer/</code>（概念，無 TODO；stub 時預設用它）→ 每個 variant 都要有<strong>非空</strong> <code>readme.md</code>、不能有壞連結；有程式碼就要 <code>main.ts</code>（&gt;1 行）→ 流程：解析計畫 → <code>mkdir -p</code> → 建 stub readme → 跑 <code>pnpm ai-hero-cli internal lint</code> → 修到過。搬動／重新編號用 <code>git mv</code> 保歷史，改完再 lint。</p>","output":"<p>練習目錄骨架。</p>","when":"<p>開新章節、把大綱變成目錄。</p>","confuse":"<p>它只建<strong>結構</strong>，內容要 <code>writing-shape</code>／<code>teach</code> 來填。</p>","next":"<p><code>writing-shape</code>（寫講義）→ <code>teach</code>（帶課）。</p>"},"writing-fragments":{"one":"<p>只做 explore——把「可能活到最後」的片段挖出來存檔，這階段不排結構、不寫大綱。</p>","disease":"<p>一開始就急著架構，結果骨架先於內容，每段都空；或好句子散在對話裡，過兩天就找不回來。</p>","mech":"<ol><li>跑一場拷問逼出片段，<strong>從使用者的第一句話（含初始 prompt）就開始捕捉</strong>。</li><li><strong>片段的判準</strong>：作者自己看得懂就夠，不必對冷讀者自足。問「這是不是好文字」，不是「這是不是完整論述」。</li><li>允許的形態：一句想用但不知道放哪的句子／主張＋一行理由／小故事、程式碼、情境、類比／半成形念頭（「某種 X 像 Y 的感覺，之後再想」）／引文、對話、偷聽到的話／靠感覺聚在一起的一串觀察／抱怨、自白、punchline。</li><li><strong>最值錢的是 leading word（領頭詞）</strong>：一個能把整篇掛住的壓縮比喻或自創詞（像 *tracer bullets*、*fog of war*）。當對話繞著同一個念頭轉，就逼出一個詞來命名它——它會在後面的結構、轉場、標題一路付紅利。</li><li><strong>檔案格式</strong>：單一 H1 工作標題，其後只有片段；片段之間用 <code>---</code> 分隔；不准小標、不准 tag、不准排序。</li><li><strong>節奏</strong>：安靜地 append，不要每則都問「要不要存」；每次寫入前<strong>重讀磁碟上的檔案</strong>（使用者可能改過、刪過），只 append 不覆寫——除非他明確叫你改某一則。</li></ol>","output":"<p>一份 <code># 工作標題</code> ＋ 以 <code>---</code> 分隔的片段堆。</p>","when":"<p>「我想寫但還沒想清楚」「幫我把零散想法收一收」——文章、電子報、演講稿都適用。</p>","confuse":"<p>它<strong>不准</strong>排大綱、不准寫開頭，那是 <code>writing-shape</code>／<code>writing-beats</code> 的工作。「explore 與 exploit 分開」是這條線唯一的核心紀律。</p>","next":"<p><code>writing-shape</code>（論證型）或 <code>writing-beats</code>（節奏型）。</p>"},"writing-shape":{"one":"<p>把素材堆逐段長成文章——先選開頭定調，之後每段都先問「讀者接下來需要聽什麼」。</p>","disease":"<p>素材一堆卻長不出文章；或直接從第一段開寫，寫到一半才發現整篇沒有論點。</p>","mech":"<ol><li><strong>讀完整堆</strong>——素材檔<strong>唯讀</strong>，這個 skill 不准改它。</li><li>先跟你敲定<strong>先備知識</strong>：讀者走進來已經懂什麼（prerequisite）；其餘概念都必須先被某一段「ground」過，才能被後面的段落引用。</li><li><strong>寫 2–3 個候選開頭</strong>，每個暗示不同的論點／角度，全部攤出來，逼你選一個或混血。<strong>選定的開頭決定整篇要完成什麼。</strong></li><li><strong>逐段生長</strong>：問「給定這個開頭，讀者接下來需要聽什麼？」從素材堆挖答案。每段只准踩已 grounded 的概念，並在落地時 ground 新概念。</li><li><strong>公開爭論形式</strong>：這段該是散文、清單、表格、callout、引文、還是程式碼區塊？理由要說得出來（清單承載平行項、散文承載論證；重複 3 次以上同構才用表格；引文只在「原話本身就是重點」時用）。</li><li>每談定一段就<strong>立刻 append</strong>，不要批次寫；重讀磁碟再寫，保留你的編輯。</li><li>重複到<strong>你說完成</strong>——完成由你決定，不是素材用完。</li></ol>\n<p><strong>接地（grounding）</strong> 是核心：單位是<strong>概念</strong>不是詞，沒有術語也可能踩空。取捨是「要求太多先備 → 把讀者關在門外」vs「什麼都在文內解釋 → 開頭淹死」。</p>\n<p>對話語氣是「反過來的拷問」：「這段為讀者做了什麼前一段沒做的？」「砍掉會壞什麼？」「這是散文還是該用清單？為什麼是散文？」「這句在做兩件事——拆開或選一個。」</p>","output":"<p>一份獨立文章檔（素材檔不動）。</p>","when":"<p>素材已足夠、要寫成<strong>有論證</strong>的文章（教學文、設計說明、長篇部落格）。</p>","confuse":"<p><code>writing-beats</code> 吃同一堆素材，但走「節奏旅程」；<code>writing-shape</code> 走「論證段落」。兩者<strong>二選一</strong>，不是接續關係。</p>","next":"<p><code>edit-article</code>。</p>"},"writing-beats":{"one":"<p>把素材組織成一趟 beat 旅程——一次只寫一個 beat，每次給你 2–3 個候選下一步。</p>","disease":"<p>文章寫成平鋪直敘的報告；或一次寫太多，方向錯了才發現，整篇重來。</p>","mech":"<ol><li>先定<strong>先備知識</strong>（讀者進場就懂什麼）。</li><li>從素材寫 <strong>2–3 個候選開場 beat</strong>，每個是不同入口、標明各自 ground 了什麼；<strong>先給你看再寫檔</strong>。你選一個，並預告那條路解鎖哪些 beat。</li><li>只寫<strong>那一個 beat</strong> 就停。beat 可以是一句話、一段、或多段的小場景。</li><li><strong>重讀磁碟上的文章</strong>，再給 2–3 個候選<strong>下一個 beat</strong>——每個都必須從目前已 grounded 的概念可達，並標明它 ground 什麼。</li><li>重複到旅程自然結束。</li></ol>\n<p><strong>beat 的定義</strong>：一個動作——設場景、落一個點、問一個問題、丟一句旁白、轉一次角度，然後停，讓下一個 beat 能轉向。<strong>需要五段加三個小標才寫得完的，不是 beat，是兩個黏在一起，要拆。</strong></p>\n<p><strong>結束條件</strong>：旅程完成，不是素材用完——剩下片段沒用上是正常的，那正是「素材要多於需求」的目的。</p>","output":"<p>一份獨立文章檔（逐 beat append，<strong>絕不提前寫</strong>）。</p>","when":"<p>想要<strong>節奏、轉折、懸念</strong>的文章（故事、觀點文、演講稿）。</p>","confuse":"<p><code>writing-shape</code> 是「論證優先」，<code>writing-beats</code> 是「路徑優先」；同一堆素材、兩種成品，別想兩個都跑。</p>","next":"<p><code>edit-article</code>。</p>"},"edit-article":{"one":"<p>把草稿切成 section，依資訊依賴（DAG）重排，再逐段重寫到每段 ≤ 240 字。</p>","disease":"<p>文章結構跳躍、前後依賴顛倒（先講結論才鋪前提）；或段落又長又繞，讀者中途迷路。</p>","mech":"<ol><li>依標題切成 section，先想清楚每段要主張什麼。</li><li>把資訊視為<strong>有向無環圖（DAG）</strong>：某段的理解依賴另一段的資訊，順序必須尊重這些依賴；切完<strong>先跟你確認</strong>。</li><li>逐段重寫，改善清晰、連貫、流動；<strong>每段上限 240 字</strong>（這個上限是逼你砍的機制，不是建議）。</li></ol>","mechHint":"原文只有 15 行，規則短而硬","output":"<p>重寫後的文章（結構可能被重排）。</p>","when":"<p>草稿完成後、發佈前；「幫我編這篇」「讀起來卡卡的」。</p>","confuse":"<p>它不是 <code>writing-shape</code>——<code>writing-shape</code> 從素材<strong>長出</strong>文章；<code>edit-article</code> 只處理<strong>已存在的稿</strong>，不新增內容。</p>","next":"<p>發佈；或回 <code>writing-shape</code> 補新段落。</p>"},"writing-great-skills":{"one":"<p>寫 skill 的寫作指南——用 leading word、完成判準、資訊階梯，換取「每次跑法一致」。</p>","disease":"<p>skill 愈寫愈長卻愈不穩；同一件事在多處重複；模型每次都漏掉某一步，或提早宣稱做完。</p>","mech":"<ul><li><strong>最高德性是 predictability</strong>：同一個<strong>流程</strong>每次跑，不是同一份輸出。</li><li><strong>invocation 取捨</strong>：model-invoked 保留 description（可被自動叫用、別的 skill 也叫得到），代價是<strong>每回合都佔 context</strong>；user-invoked（<code>disable-model-invocation: true</code>）零 context，但吃你的記憶成本。只有「agent 必須自己找到它」或「別的 skill 要叫它」才值得 model-invoked。</li><li><strong>資訊階梯</strong>：in-skill step（有序動作，每步要有<strong>可檢查的完成判準</strong>）→ in-skill reference（按需查閱的規則，可以是一整排平行的規則，不算壞味道）→ external reference（用 <strong>context pointer</strong> 推到外部檔；指標的<strong>措辭</strong>決定 agent 會不會真的去讀）。</li><li><strong>切分時機</strong>：按 invocation 切（有獨立 leading word 才切）／按 sequence 切（後面的步驟會誘使 agent 提早收工時，把後面的步驟藏起來）。</li><li><strong>leading word</strong>：模型預訓練裡就有的壓縮概念（*lesson*、*fog of war*、*tracer bullets*、*red*）。它同時錨定<strong>執行</strong>（看到詞就做同一件事）與<strong>被叫用</strong>（你的 prompt、文件、程式碼用同一個詞）。把三處重述收斂成一個詞，省 token 又更可靠。</li><li><strong>六大失效模式</strong>：premature completion（提早收工）、duplication（同一意義多處）、sediment（只加不敢刪的沉積）、sprawl（每行都活但太長）、no-op（模型預設就會做的事，講了等於沒講）、negation（用禁止句反而強化該行為——要改講正面的目標行為）。</li><li><strong>修剪</strong>：單一真相來源；逐句做 no-op 測試，失敗就<strong>整句刪</strong>，不要只修字。</li></ul>","output":"<p>一份更好讀、更可預測的 <code>SKILL.md</code>（不產生其他檔案）。</p>","when":"<p>「這個 skill 每次都漏東漏西」「description 愈寫愈長」「skill 太多記不住，想要一個 router」。</p>","confuse":"<p>它教的是<strong>寫 skill</strong>，不是寫文章；文章走 <code>writing-fragments → writing-shape</code>。</p>","next":"<p>實際動手改那個 skill；skill 變多就補一個 router（像 <code>ask-matt</code>）。</p>"},"research":{"one":"<p>派背景 agent 查一手來源，把每條主張連回出處，產出一份 markdown 筆記。</p>","disease":"<p>查資料靠二手整理或模型記憶，事實錯得不知不覺；或自己讀文件讀掉一整個 session。</p>","mech":"<ol><li>開一個<strong>背景 agent</strong>，你繼續工作、它去讀。</li><li>只查<strong>一手來源</strong>——官方文件、原始碼、規格、第一方 API，<strong>不是</strong>別人的二手整理；每條主張都要追回擁有它的源頭。</li><li>寫進<strong>單一 markdown</strong>，每條主張都附出處。</li><li>存到 repo 既有的筆記慣例位置；沒有慣例就放合理處並說明放哪。</li></ol>","output":"<p>一份帶引用的研究筆記。</p>","when":"<p>「幫我查這個 API 怎麼用」「不要憑記憶回答我」；或想把 reading legwork 外包。</p>","confuse":"<p>它只<strong>蒐集事實</strong>，不幫你決策；把研究變成設計共識要走 <code>grill-with-docs</code>。</p>","next":"<p><code>grill-with-docs</code>／<code>to-spec</code>（研究餵思考，不取代思考）。</p>"},"teach":{"one":"<p>把當前目錄當學習工作區，跨多次 session 教一個主題，產出 lesson、reference、learning record。</p>","disease":"<p>學習東看一點西看一點，沒有累積；或一次講完就忘——只有 fluency，沒有 storage strength。</p>","mech":"<ul><li><strong>目錄即狀態</strong>：<code>MISSION.md</code>（為什麼學，所有教學都要 grounding 在它上面）、<code>RESOURCES.md</code>（高信任資源）、<code>reference/*.html</code>（速查卡：語法、演算法、詞彙表）、<code>learning-records/*.md</code>（像 ADR 的學習紀錄，用來算 ZPD）、<code>lessons/*.html</code>（教學單元）、<code>assets/*</code>（共用元件）、<code>NOTES.md</code>（你的偏好）。</li><li><strong>三根支柱</strong>：knowledge（高品質來源，<strong>不要相信自己的參數記憶</strong>）、skills（互動課程＋<strong>盡量即時的回饋迴圈</strong>）、wisdom（把你丟回社群）。</li><li><strong>fluency vs storage strength</strong>：課堂上想得起來 ≠ 長期記得。用 retrieval practice（回想）、spacing（分散）、interleaving（交錯，只用在技能）製造「合意困難」。</li><li><strong>每課要短</strong>、很快可完成（工作記憶很小），但要留下<strong>一個具體可帶走的勝利</strong>；排版要美、可列印；引用一手來源；提醒你可以追問 agent。</li><li><strong>落在 ZPD</strong>（最近發展區）：讀 learning records ＋ mission，決定「剛好難一點」。</li><li><strong>元件優先用 <code>assets/</code> 既有的</strong>；新的就寫成元件，不要 inline 一份未來會重複的程式。</li><li>測驗選項<strong>字數（與字元數）要一致</strong>，不靠排版洩漏答案。</li></ul>","output":"<p><code>lessons/</code>、<code>reference/</code>、<code>learning-records/</code>、<code>assets/</code>。</p>","when":"<p>「教我這個主題」「我要花幾週學 X」——重點是<strong>跨 session 的累積</strong>。</p>","confuse":"<p><code>research</code> 是查一次資料；<code>teach</code> 是設計一門課。<code>scaffold-exercises</code> 只建目錄骨架，內容還是要靠這裡。</p>","next":"<p><code>research</code>（補資源）→ <code>scaffold-exercises</code>（若要變成正式課程）。</p>"},"handoff":{"one":"<p>把當前對話壓成一份交接文件給下一個 agent，存到作業系統暫存目錄、不留在 workspace。</p>","disease":"<p>context 快滿、換 session 就全部重來；或直接 compact 之後模型迷失方向。</p>","mech":"<ol><li>寫一份摘要，讓<strong>全新的 agent</strong> 能接手繼續做。</li><li>存到<strong>作業系統暫存目錄</strong>——不是當前 workspace（避免把交接文件混進專案）。</li><li>內含 <strong>suggested skills</strong> 段，指名下一個 agent 該叫哪些 skill。</li><li><strong>不要重複</strong>其他產物已經記下的內容（spec、plan、ADR、issue、commit、diff）——改用路徑或 URL 指過去。</li><li><strong>遮蔽敏感資訊</strong>：API key、密碼、可識別個資。</li><li>有參數就當「下一個 session 要專注什麼」，據此調整文件。</li></ol>","output":"<p>一份 markdown 交接文件（在 OS 暫存目錄）。</p>","when":"<p>context 接近 smart zone（約 120k）、要分岔去 <code>prototype</code>、或要把工作交給另一個 session／agent。</p>","confuse":"<p><code>/compact</code> 是<strong>同一個對話</strong>裡摘要前文（continue）；<code>handoff</code> 是<strong>開新對話</strong>、靠文件接續（fork）。</p>","next":"<p>新 session 讀那份文件。</p>"},"wizard":{"one":"<p>用 <code>template.sh</code> 產生互動式 bash 精靈，帶人一步步走完手動流程。</p>","disease":"<p>第三方設定或一次性遷移每次都要重講一遍，講漏一步就卡住；或文件寫了但沒人照做。</p>","mech":"<ol><li><strong>圈範圍</strong>：先讀 repo（<code>.env*</code>、README、<code>docker-compose*</code>、框架設定、<code>.github/workflows/*</code> 裡每個 <code>secrets.*</code>／<code>vars.*</code>），找出「人要做的每一步」與「沿途要收的每個值」，列出 stage 順序與各 stage 產出什麼，<strong>先跟你確認</strong>。 完成判準：每個值都知道 (a) 人從哪拿到 (b) 寫到哪（<code>.env</code>／GitHub secret／兩者／不寫）(c) 是否機密。</li><li><strong>畫路徑</strong>：每個 stage 寫出精確動線（開哪個 URL → 點什麼 → 值顯示在哪 → 填哪個變數）。<strong>不知道當前 UI 就問人或查文件，不准編造不存在的步驟。</strong></li><li><strong>寫精靈</strong>：複製 <code>template.sh</code>，用 <code>stage</code>／<code>say</code>／<code>open_url</code>／<code>ask</code>／<code>ask_secret</code>／<code>write_env</code>／<code>set_secret</code>／<code>confirm</code>；<code>TOTAL_STAGES</code>、<code>TOTAL_MINUTES</code> 要誠實（驅動剩餘時間顯示）；<strong>marker 以上的 library 不准手改</strong>（每個精靈都一樣，一致性就是重點）；每個 stage 清屏、只做一件聚焦的事。</li><li><strong>驗證</strong>：<code>bash -n</code>、有 shellcheck 就跑、<code>chmod +x</code>；<strong>不要自己跑完</strong>（它會開瀏覽器、卡在人輸入）——改用靜態追蹤：每個值都被收、每個 <code>set_secret</code> 名稱與 CI 的 <code>secrets.*</code> 完全對上。</li></ol>\n<p><strong>預設用完即丟</strong>：放 scratch 或 <code>scripts/</code>，事後刪；只有要變成可重複的設定路徑才 commit，並從 README 連過去。</p>","mechHint":"四步","output":"<p>一支可執行的互動 bash 精靈（可選：commit ＋ README 連結）。</p>","when":"<p>第三方服務設定、一次性遷移、A→B 的狀態轉換。</p>","confuse":"<p><code>wizard</code> 是<strong>給人跑的引導腳本</strong>（每步都要人動手）；<code>setup-pre-commit</code> 是直接幫你裝好鉤子，不需要人一步步點。</p>","next":"<p>照精靈跑完 → 回到主流程。</p>"}};
/*DETAILS_END*/

const grid = document.getElementById("grid");
const countEl = document.getElementById("count");

function cardHTML(c){
  const cls = TYPE_CLASS[c.type] || "t-jipan";
  return `
  <article class="card ${cls}" data-type="${c.type}" data-mode="${c.mode}" data-name="${c.name}"
    tabindex="0" role="button" aria-label="${c.name} — 看完整詳解">
    <div class="card-inner">
      <div class="card-head">
        <div class="head-row">
          <span class="no">${c.id}</span>
          <span class="badges">
            <span class="badge ${c.mode === "自動" ? "auto" : "manual"}">${c.mode}</span>
          </span>
        </div>
        <h2 class="name">${c.name}</h2>
        <div class="type"><span>${c.type}</span><span class="bar"></span></div>
      </div>
      <div class="card-body">
        <div class="field">
          <div class="k">用途</div>
          <div class="v">${c.use}</div>
        </div>
        <div class="field">
          <div class="k">使用時機</div>
          <div class="v">${c.when}</div>
        </div>
        <div class="chain">
          <div class="k" style="font:700 9.5px/1 ui-monospace,monospace;letter-spacing:.16em;color:var(--dim);margin-bottom:5px">連鎖</div>
          <div class="v"><span class="arw">→</span>${c.next}</div>
        </div>
      </div>
      <div class="card-foot">
        <span>MATT POCOCK · ENGINEERING</span>
        <span class="foot-right"><span class="more">詳解＋</span><span class="gem"></span></span>
      </div>
    </div>
  </article>`;
}

grid.innerHTML = CARDS.map(cardHTML).join("");

let activeType = "all";
let activeMode = null;

function apply(){
  let shown = 0;
  document.querySelectorAll(".card").forEach(el=>{
    const okType = activeType === "all" || el.dataset.type === activeType;
    const okMode = !activeMode || el.dataset.mode === activeMode;
    const visible = okType && okMode;
    el.classList.toggle("hidden", !visible);
    if(visible) shown++;
  });
  countEl.textContent = `${shown} / ${CARDS.length}`;
}

document.querySelectorAll('.chip[data-filter]').forEach(btn=>{
  btn.addEventListener("click", ()=>{
    document.querySelectorAll('.chip[data-filter]').forEach(b=>b.classList.remove("on"));
    btn.classList.add("on");
    activeType = btn.dataset.filter;
    apply();
  });
});

document.querySelectorAll('.chip[data-mode]').forEach(btn=>{
  btn.addEventListener("click", ()=>{
    const v = btn.dataset.mode;
    if(activeMode === v){
      activeMode = null;
      btn.classList.remove("on");
    } else {
      activeMode = v;
      document.querySelectorAll('.chip[data-mode]').forEach(b=>b.classList.remove("on"));
      btn.classList.add("on");
    }
    apply();
  });
});

apply();

/* ---------- detail sheet ---------- */
const CARDS_BY_NAME = Object.fromEntries(CARDS.map(c => [c.name, c]));
const LABELS = [
  ["one", "一句話"],
  ["disease", "解決什麼病"],
  ["mech", "運作機制"],
  ["output", "產出"],
  ["when", "使用時機"],
  ["confuse", "別搞混"],
  ["next", "後續接著"]
];

const sheet = document.getElementById("sheet");
const panel = document.getElementById("sheetPanel");
const sheetBody = document.getElementById("sheetBody");
const sheetClose = document.getElementById("sheetClose");
let lastFocus = null;

function openSheet(name){
  const c = CARDS_BY_NAME[name];
  if (!c) return;
  const d = DETAILS[name] || {};

  lastFocus = document.activeElement;
  panel.className = "panel " + (TYPE_CLASS[c.type] || "t-jipan");

  document.getElementById("sheetNo").textContent = c.id;
  const mode = document.getElementById("sheetMode");
  mode.textContent = c.mode;
  mode.className = "badge " + (c.mode === "自動" ? "auto" : "manual");
  document.getElementById("sheetName").textContent = c.name;
  document.getElementById("sheetType").textContent = c.type;

  sheetBody.innerHTML = LABELS
    .filter(([k]) => d[k])
    .map(([k, label]) => {
      const hint = d[k + "Hint"]
        ? `<span class="hint-tag">${d[k + "Hint"]}</span>`
        : "";
      return `<section class="sec"><div class="lbl">${label}${hint}</div>${d[k]}</section>`;
    })
    .join("");

  document.getElementById("sheetChain").innerHTML =
    `<span class="arw">連鎖 →</span>${c.next}`;

  sheet.classList.add("open");
  sheet.setAttribute("aria-hidden", "false");
  document.body.style.overflow = "hidden";
  sheetClose.focus();
}

function closeSheet(){
  if (!sheet.classList.contains("open")) return;
  sheet.classList.remove("open");
  sheet.setAttribute("aria-hidden", "true");
  document.body.style.overflow = "";
  if (lastFocus && lastFocus.focus) lastFocus.focus();
}

grid.addEventListener("click", e => {
  const card = e.target.closest(".card");
  if (card) openSheet(card.dataset.name);
});

grid.addEventListener("keydown", e => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const card = e.target.closest(".card");
  if (!card) return;
  e.preventDefault();
  openSheet(card.dataset.name);
});

document.querySelectorAll("[data-close]").forEach(el => {
  el.addEventListener("click", closeSheet);
});

document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeSheet();
});
</script>
</body>
</html>
